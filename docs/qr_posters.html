<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>QRポスター（A4・2枚）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!--
  松本が南口で掲げる掲示。A4縦で2枚刷る（1回目 / 2回目）。

  ★ ポスターに条件の中身は書かない。
     参加者に条件の存在を気づかれると、条件そのものへの反応（要求特性）が入る。
     見分けは右上の「1回目」などの表記だけ。

  ★2026-10-07: 4枚→3枚。QR は南口で1回読むだけ。ゆき/かえりはアプリ内で切り替える
     （実験者は南口で離脱するので、桃山台で別のQRを出す人がいない）。
     入力方式と「わからない」ボタンの有無は、アプリが (回目, ゆき/かえり, 組) から決める。
  ★2026-10-07: 3枚→2枚。計数研究は ★乗降人数計算 に分けた（tools/make_count_qr.py）。
-->
<style>
  @page { size: A4 portrait; margin: 12mm; }
  * { box-sizing: border-box; }
  body { font-family: "Yu Gothic", "游ゴシック", "Meiryo", sans-serif; margin: 0; color: #111; }
  .poster { width: 186mm; height: 273mm; page-break-after: always;
            display: flex; flex-direction: column; align-items: center;
            border: 0.6mm solid #333; border-radius: 3mm; padding: 10mm 8mm; position: relative; }
  .poster:last-child { page-break-after: auto; }
  .mark { position: absolute; top: 6mm; right: 8mm; font-size: 20pt; font-weight: 700;
          color: #333; line-height: 1; }
  h1 { font-size: 26pt; margin: 4mm 0 2mm; text-align: center; letter-spacing: .04em; }
  .sub { font-size: 12pt; color: #444; text-align: center; margin: 0 0 6mm; }
  .qr { width: 115mm; height: 115mm; }
  .qr img, .qr canvas { width: 115mm !important; height: 115mm !important; display: block; }
  .url { font-family: Consolas, "Courier New", monospace; font-size: 10pt;
         margin-top: 6mm; color: #333; word-break: break-all; text-align: center; }
  .steps { margin-top: auto; width: 100%; border-top: 0.3mm solid #bbb; padding-top: 5mm; }
  .steps h2 { font-size: 13pt; margin: 0 0 3mm; }
  .steps ol { margin: 0; padding-left: 6mm; font-size: 12pt; line-height: 1.85; }
  .steps b { background: #fff2a8; padding: 0 .2em; }
  .warn { font-size: 10.5pt; color: #b00; margin-top: 4mm; }
  @media screen { body { background: #eee; padding: 10mm; }
                  .poster { background: #fff; margin: 0 auto 10mm; } }
</style></head><body>
<div id="sheet"></div>
<script>
  const BASE = "https://matsumototaichi-beep.github.io/bus-ui-study/";
  // 中身（数字キー/＋−ボタン・わからないボタンの有無）はポスターに書かない。
  // 参加者が条件に気づくと、条件そのものへの反応が混ざるため。
  const POSTERS = [
    { mark: "1回目",    qs: "?round=1",     last: "ログインしたら<b>「ゆき」</b>を押して、実験者に見せてください" },
    { mark: "2回目",    qs: "?round=2",     last: "ログインしたら<b>「ゆき」</b>を押して、実験者に見せてください" },
  ];
  const sheet = document.getElementById("sheet");
  POSTERS.forEach(function(po){
    const url = BASE + po.qs;
    const el = document.createElement("div");
    el.className = "poster";
    el.innerHTML =
      '<div class="mark">' + po.mark + '</div>' +
      '<h1>このQRを読み取ってください</h1>' +
      '<p class="sub">スマホの<b>カメラアプリ</b>で読み取ってください</p>' +
      '<div class="qr"></div>' +
      '<div class="url">' + url + '</div>' +
      '<div class="steps"><h2>開いたらすること</h2><ol>' +
        '<li><b>「ログイン」</b>タブを選ぶ（「新規登録」ではありません）</li>' +
        '<li>カードの <b>ID</b> と <b>パスワード</b> を入力</li>' +
        '<li>うまくいかないときは<b>「パスワードを表示して確かめる」</b>にチェック</li>' +
        '<li>' + po.last + '</li>' +
      '</ol><p class="warn">※ LINE や Discord の中のブラウザでは開かないでください。' +
      'カメラアプリから開いてください。</p></div>';
    sheet.appendChild(el);
    new QRCode(el.querySelector(".qr"),
      { text: url, width: 520, height: 520, correctLevel: QRCode.CorrectLevel.M });
  });
</script>
</body></html>
