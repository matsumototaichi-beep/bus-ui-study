<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>乗降アプリ</title>
<!--
  乗降アプリ（計数研究）  counter-2.3.1

  ★2026-10-17 (counter-2.3.0): 横画面を、縦画面と同じように最後まで通して使えるようにした（松本の指示）。
    2.2.0 までは、練習モード・送り直し・位置情報オフ・確認用アカウントが重なると「送信」が画面からはみ出し、
    ノッチのある端末の横画面（812×375）では 23.3px はみ出して、見えている所を押すと下の帯が反応していた。
    ・使わない余白と見出しを削って、横画面で 62px ぶんの縦を作った
      - 練習モードの帯を、着席/立席・練習のボタンと同じ行に出した（1行ぶん 22.3px）
      - バス停の枠を1行に寄せた（「バス停」の見出しを隠し、送り直しの帯をバス停名の右に置く。92px → 52px）
    ・作ったぶんは「わからない」と「送信」のあいだに回し、32px → 60px（縦画面と同じ）に戻した。
      ここが狭いと、「わからない」を押した指がすべってそのまま送信に当たる
    ・＋1 の高さ（--plush＝44px）と、押せる高さ 44px はどこも下げていない。
      ＋1・−1・わからない・変える・送信 はすべて 44px 以上のまま
    ・縦画面（390×664・375×667・360×640・320×568）の見え方は変えていない。
      直したのは @media (orientation:landscape) and (max-height:520px) の中だけ

  ★2026-10-16 (counter-2.2.1): 「送信」の歯止めを画面に出すようにした
    ・歯止め（画面が出てから1秒・最後のタップから700ミリ秒）に当たると、これまでは何も知らせずに捨てていた。
      参加者からは「押したのに無反応」に見え、1回押して目を離すとそのバス停の記録が残らなかった。
      歯止めのあいだは「送信」を薄くして押せない見た目にする（disabled なので押しても何も起きず、
      send の中の「少し待ってから」の知らせには届かない。見た目で分かるのでこれでよい）
    ・「わからない」を押したときも歯止めを効かせる（lastTapAt を動かす）。2.2.0 で横画面の
      「わからない」と「送信」が 31.8px まで近づき、すべった指がそのまま送られるおそれが出たため

  ★2026-10-16 (counter-2.2.0): 松本が実機を見たうえでの指示どおりに、数える枠のボタンを並べ直した
    ・数える枠を1行にした。並びは「数 ／ ＋1 ／ −1 ／ わからない」。
      ＋1・−1・わからない は同じ大きさ（列の幅は三等分、高さは --plush）にして、
      これまで ＋1 だけが使っていた幅に3つを収めた。2行目（わからない）は無くした。
      −1 が小さくて押しづらい、という指摘への直し。＋1 と −1 が隣り合うので、
      誤って押さないよう列のすき間は 18px（2.1.1 の ＋1−−1 間と同じ）を取る。
      狭い画面と横画面だけ 16px に詰める
    ・丸番号（①②③④）を消した。わかりづらい、という指摘への直し。
      見出しの文字（バス停・乗ってきた人・降りた人・送信）はそのまま残してある
    ・横画面で「送信」がはみ出していたのを直した（667×375 のふつうの状態で 21.6px、
      練習モードでは 44.5px はみ出し、見えている所を押すと位置情報の帯が反応して送れなかった）。
      1行にしたぶん（横画面で51px）に加えて、横画面だけ 見出し・枠の余白・送信の上の余白 を詰めた。
      ＋1 の高さ（--plush）と、押せる高さ 44px はどこも下げていない

  ★2026-10-16 (counter-2.1.1): 2.1.0 の独立検証で出た、画面からはみ出す・読めない・押し間違える を直した
    ・【最優先】「送信」が画面からはみ出していた。原因は2つで、かえりにもヘッダのボタンが出て
      ヘッダが 45.6px → 85.6px に増えたこと、「わからない」で枠ごとに1行（2枠で約112px）増えたのに、

    ・横画面（667×375 など）では、乗ってきた人・降りた人の枠を左右に並べる。
      縦に積んだままだと、降りた人の＋1 がスクロールしないと押せなかった。
      枠の中の並び（数／＋1／−1、その下にわからない）は縦画面と同じまま変えていない
    ・押せない（disabled）あいだの「−1」「1つ戻す」が読めなかった（明暗の比 1.72対1）。
      バス停の画面は毎回 0 から始まるので、初めて見る瞬間がいちばん読めない状態だった。
      薄さは枠と背景で表し、文字は読める濃さ（6.9対1）に戻した。＋1 も押せないあいだは
      色を変えるだけにして、文字が薄くならないようにした
    ・降りた人の「わからない」と「送信」のあいだを 40.8px → 約60px に広げた。
      ＋1 のあとに効く700ミリ秒の歯止めは「わからない」では働かないので、すべった指がそのまま送信に当たっていた
    ・確認用アカウントの向き切り替えが説明と違っていた。かえりへ移ると区間の印が kaeri になり、

      確認用アカウントのときはゆきへ戻るときに印も一緒に戻し、本当に行き来できるようにした

  ★2026-10-15 (counter-2.1.0): 車内人数アプリ（count.html）と数え方をそろえ、ボタンの並びと行き来を直した
    ・「乗ってきた人」「降りた人」のそれぞれに「わからない」を足した。車内人数アプリには「わからない」があり、

      押した瞬間は操作ログに events の "unknown"（field / on / value_before）で、押した回数は
      summary の board_unknown_taps / alight_unknown_taps で残る。表の列は増やしていない
    ・並びを「数 ／ ＋1 ／ −1」に変えた（−1 を ＋1 の右に置く）。−1 には「1つ戻す」と添えて、
      何をするボタンかを見てわかるようにした。＋1 とのあいだに 18px のすき間を取り、誤って押しにくくしている。
      「わからない」は数の枠の下（2行目の左）に置き、＋1 とは隣り合わせない。
      ＋1 は2行ぶんの高さにして、いちばん押しやすいままにした
    ・かえり（?dir なし）でも、ヘッダから車内人数アプリへ移れるようにした（「車内人数アプリへ」→ count.html。

      （ゆきでは「かえりへ」、かえりでは「ゆきへ」）。本番前の確認で向きを変えられるように

  ★2026-10-15 (counter-2.0.8): 計数研究の人数アプリを index.html から count.html に分けた。
    index.html は UI研究専用（本実験のあいだ uiStudy-0.9.7 のまま凍結）にするため。

  ★2026-10-15 (counter-2.0.7): 画面の言葉だけを直した。ふるまいは 2.0.6 と同じ

      アンケートの選択肢・配布用紙・人数アプリ自身の見出しと呼び名をそろえるため。「乗降アプリ」はそのまま
    ・ゆき（?dir=out＝偶数組）のヘッダにある「かえりに切り替える」の確かめの文を、
      「桃山台駅に着きましたか？」といまどこにいるかを聞く言い方にした。
      これまでは移ってよいかだけを聞いていたので、桃山台駅に着く前に押すと、
      その人のゆきの記録がそこで終わってしまった

  ★2026-10-14 (counter-2.0.6): かえりの便を「計数研究ゆき」として記録してしまう穴を塞いだ
    ・ログアウトしても、その日が計数研究（countapp_round_v1 が "count"）なら、回目と区間の印
      （countapp_round_v1 / countapp_leg_v1 / countapp_leg_at_v1 / countapp_leg_set_v1）を消さずに残す。
      消すと「まだゆき」に戻ってしまい、ログインし直したあと、かえりの便をゆきとして記録してしまう。
      確認用アカウント（組の表に無いID）のときは今までどおり全部消す
    ・送る行の variant に leg_by / leg_at（区間をいつ・どう決めたか）を入れる。読み方は index.html の legSet と同じ。
      あとから「かえりの便をゆきとして記録していないか」を見分けるため
    ・ゆき（?dir=out）の古いタブで、もうかえりに進んでいるとき（countapp_leg_v1="kaeri"）は ＋1 と「送信」を止め、

  ★2026-10-14 (counter-2.0.5): かえり（?dir なし＝奇数組）で開いたら、ログインのあとに「かえりに入った」印
    （countapp_leg_v1="kaeri"）を立てる。これまでは誰も立てていなかったので、奇数組がこのアプリに移ったあと

    「かえりに切り替える」で未送信が残るときの文言も、移ったあと人数アプリが続けて送ることを伝える言い方に直した

  ★2026-10-14 (counter-2.0.4): 計数研究で、数え方と方向の組み合わせを組ごとに入れ替えた。偶数組（B D F H …）は
    ゆきがこの乗降アプリ（?dir=out）で、桃山台駅でヘッダの「かえりに切り替える」から車内人数アプリ（count.html?leg=kaeri）へ移る。
    奇数組（A C E G …）は今までどおり、ゆき＝人数アプリ・かえり＝この乗降アプリ（?dir なし）。
    送る行に組（variant.group）と確認用アカウントかどうか（variant.test_account）も入れる

  ★2026-10-09 (counter-2.0.2): 位置情報の直し方の画面を短くした。手順は1つだけ大きく出し、ほかの確かめ方はたたむ。
    375×667 でスクロールせずにボタンまで見える。いつ出すか・ボタンを押したときのふるまいは 2.0.1 と同じ。index.html（uiStudy-0.9.5）と同じ文言

  ★2026-10-08 (counter-2.0.1): 位置情報が拒否されたとき（iPhone の Safari が許可を聞かずに拒否することがある）、

  ★2026-10-07: 計数研究（車内を1から数える vs 乗った人・降りた人を数えて足し引き）が UI研究とは別の実験になったので作り直した。
    ゆき＝人数アプリ index.html（?study=count）で車内を1から数える。かえり＝このアプリで乗った人・降りた人を数える。
    桃山台駅で人数アプリの「かえりに切り替える」を押すとここに来る。画面の順番は参加者向け案内の「人数の答え方」と同じ。
  ・参加者1人が、停まるたびに乗ってきた人・降りた人の両方をその場でタップする。係の分担（乗車係・降車係・数え直し係）はやめた。
    1便に参加者が数人乗り、全員がそれぞれ独立に記録する
  ・車内の合計人数（足し引きの結果）はどこにも出さない。合計を見ると車内を見回して直したくなり、1から数える方式と混ざるため
  ・ログインは人数アプリと共有する（同じサイト・同じ Supabase なので、人数アプリでログイン済みならそのまま使える）
  ・記録は ui_sessions に1バス停＝1行。新しいテーブルは作らない（variant.study="count", method="flow", app="counter"）
  ・送れないとき（電波なし・未ログイン・エラー）は端末に残し、起動時・online・画面復帰・次の送信のたびに送り直す
  ・人数アプリ（ゆき）で送れずに残った回答・操作ログもここから送る（桃山台駅で移ったあと、人数アプリは開き直さないため）
  ・送ったバス停の送り直しは前回の値から始める。数えている途中の値は退避し、送り直しが済んだら戻す
-->
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#f1f5f9; --muted:#94a3b8;
    --board:#2563eb; --alight:#c2410c;
    --plush:72px;   /* ＋1 の高さ（画面サイズで@mediaが上書き） */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  @supports (height:100dvh){ html,body{height:100dvh;} }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden;
  }
  /* 続けて速く押しても拡大されないように（ダブルタップ拡大を切る） */
  button{font-family:inherit; touch-action:manipulation;}
  header{flex:0 0 auto; padding:7px 12px; padding-top:calc(7px + env(safe-area-inset-top,0px));
         display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--panel);}
  .brand{flex:1 1 auto; min-width:0; font-size:14px; font-weight:800; display:flex; flex-direction:column; line-height:1.2;}
  .brand .staff{font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap;}
  /* ★counter-2.1.0: ボタンが増えたので、入りきらないときは中でも折り返す。
     縮められる（flex:1 1 auto・min-width:0）ようにしておかないと、折り返さずに画面の外へはみ出す */
  .hactions{flex:1 1 auto; min-width:0; margin-left:auto; display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px;}
  .sess{font-size:11px; color:var(--muted); white-space:nowrap;}
  .sess b{color:var(--ink); font-size:15px; font-weight:800; margin-left:3px;}
  .iconbtn{flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:10px; padding:7px 10px; font-size:13px; font-weight:600;}
  /* ★counter-2.0.4: かえり（人数アプリ）へ移るボタン。見た目は index.html の .legsw と同じ。
     ヘッダが3つのボタンで狭くなるので、入りきらないときは下の行に折り返す */
  .legsw{flex:0 0 auto; border:1px solid #2563eb; background:rgba(37,99,235,.16); color:var(--ink); border-radius:10px;
         padding:7px 10px; font-size:12.5px; font-weight:700; white-space:nowrap;}
  .legsw:active{background:rgba(37,99,235,.35);}
  .legsw:disabled{opacity:.5;}

  main{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
  .scroll{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 12px 18px;}
  .inner{max-width:420px; margin:0 auto; display:flex; flex-direction:column; gap:8px;}

  /* 着席/立席・練習（index.html と同じ見た目） */
  .expbar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .posture{display:flex; flex:0 0 auto; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
  .posture.unset{border-color:#f59e0b;}
  .pz{border:none; background:transparent; color:var(--muted); padding:7px 12px; font-size:12px; font-weight:700;}
  .pz.on{background:#2563eb; color:#fff;}
  .prac{border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:9px; padding:7px 11px; font-size:12px; white-space:nowrap;}
  .prac.on{background:#f59e0b; border-color:#f59e0b; color:#1f2937; font-weight:800;}
  .pbanner{display:block; width:100%; border:none; border-radius:10px; background:#f59e0b; color:#1f2937;
           padding:8px 10px; font-size:12.5px; font-weight:800; line-height:1.35; text-align:center;}

  /* 1バス停ぶんの画面。
     ★counter-2.2.0: 見出しの丸番号（①②③④）は消した（松本の指示。わかりづらいため）。
     見出しの文字だけを残したので、.lbl の中の gap と .no の指定も要らなくなった */
  .blk{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 10px 10px;}
  .lbl{display:flex; align-items:center; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  .stoprow{display:flex; align-items:center; gap:8px;}
  .stopname{flex:1 1 auto; min-width:0; font-size:20px; font-weight:800; line-height:1.25; overflow-wrap:anywhere;}
  .stopname small{display:block; font-size:11px; font-weight:600; color:var(--muted);}
  .lnote{margin-left:auto; font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap;}
  .renote{margin-top:4px; font-size:13px; font-weight:800; color:#fbbf24;}
  .renote[hidden]{display:none;}
  .chg{flex:0 0 auto; min-height:44px; padding:0 14px; border-radius:10px; border:1px solid #2563eb;
       background:rgba(37,99,235,.16); color:var(--ink); font-size:14px; font-weight:700;}
  .chg:active{background:rgba(37,99,235,.35);}
  .blk.fresh{animation:fresh .7s ease;}
  @keyframes fresh{0%{border-color:#60a5fa; background:#1e3a5f;}100%{border-color:var(--line); background:var(--panel);}}

  /* ★counter-2.2.0: 1行に「数 ／ ＋1 ／ −1 ／ わからない」を並べる（松本の指示）。
       数（左・幅は固定）  ＋1   −1   わからない
     ＋1・−1・わからない は同じ大きさにする。列の幅は3つとも同じ（残りの幅を三等分）、
     高さは行ごと（align-items:stretch）なので、幅も高さも必ずそろう。高さは ＋1 の --plush のまま。
     これまで ＋1 だけが使っていた幅に3つを収めるため、数の枠は 86px → 76px に細くした。
     ＋1 と −1 が隣り合うので、誤って押さないよう列のすき間は 18px
     （2.1.1 の ＋1 と −1 のあいだと同じ）を取る。狭い画面と横画面だけ 16px に詰める。
     列は 1fr ではなく minmax(0,1fr) にする。1fr のままだと、中の文字が入りきらない列だけが
     勝手に広がって3つの幅がそろわなくなる（320px 幅で実際にそうなった）。
     そのかわり、文字が必ず収まるよう ＋1 の字の大きさは画面の幅に合わせて小さくする */
  .ctr{display:grid; grid-template-columns:76px repeat(3, minmax(0,1fr)); column-gap:18px; align-items:stretch;}
  /* 3つのボタンは高さも --plush でそろえる。--plush は 72 / 56 / 46 / 44px のどれかで、44px を下回らない */
  .ctr button{border-radius:12px; font-weight:800; font-variant-numeric:tabular-nums; min-height:var(--plush); padding:0 2px;}
  .ctr .val{grid-column:1; grid-row:1; min-height:var(--plush);
            display:flex; align-items:center; justify-content:center; border-radius:12px; border:2px solid var(--line); background:var(--bg);}
  .ctr .vin{display:flex; align-items:baseline; gap:2px;}
  .ctr .val b{font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; color:var(--ink);}
  .ctr .vin > span{font-size:12px; color:var(--muted);}
  /* 「＋1」は途中で折り返させない（折り返すと2行になってボタンの高さが倍になる）。
     そのぶん字の大きさは、いちばん狭い列でも収まる 28px にした（狭い画面と横画面ではさらに小さくする） */
  .ctr .plus{grid-column:2; grid-row:1; border:none; color:#fff; font-size:28px; white-space:nowrap;}
  .ctr .plus:active{filter:brightness(1.25);}
  /* ★counter-2.1.1: 押せないあいだも文字は読める濃さのままにする（薄さは背景の色で表す）。
     opacity で薄くすると、白い「＋1」まで背景に溶けて読めなくなっていた（＋1 が押せないのは「わからない」が入のとき） */
  .ctr .plus:disabled{background:#3f4c61; color:#e8edf5; opacity:1;}
  /* ★counter-2.2.0: −1 は ＋1 と同じ大きさにした（小さくて押しづらい、という松本の指摘への直し）。
     ＋1 とのあいだのすき間（18px）は列のすき間（column-gap）で作り、誤って押しにくくする。
     何をするボタンかが見てわかるよう、数字の下に「1つ戻す」と添える（幅が足りない横画面では隠す。
     そのときも aria-label の「−1 1つ戻す」は残る） */
  .ctr .minus{grid-column:3; grid-row:1;
              display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
              border:1px solid var(--line); background:var(--bg); color:#fca5a5;}
  .ctr .minus .mn{font-size:15px; line-height:1;}
  .ctr .minus .mh{font-size:10px; font-weight:700; line-height:1; color:var(--muted);}
  /* ★counter-2.1.1: バス停の画面は毎回 0 から始まり、そのとき −1 は押せない。
     これまでは文字も枠と同じ色（var(--line)）にしていたので、明暗の比が 1.72対1 しかなく、
     「−1」も「1つ戻す」も初めて見る瞬間に読めなかった。
     薄さは枠と背景で表し、文字は読める濃さ（var(--muted) で 6.9対1）を保つ */
  .ctr .minus:disabled{color:var(--muted); border-color:#2b3a52; background:#141d33;}
  .ctr .minus:disabled .mh{color:var(--muted);}
  /* ★counter-2.2.0: 「わからない」は1行目のいちばん右（2.1.1 で −1 があった場所）。
     大きさは ＋1・−1 とそろう（列の幅は三等分、高さは行の高さ）。入のあいだは練習ボタンと同じ山吹色にする。
     折り返しは止めない。端末の書体しだいで列から1〜2px あふれることがあり、
     止めると文字が切れてしまう。折り返せば2行になるだけで、ボタンの高さ（44px 以上）には収まる */
  .ctr .unk{grid-column:4; grid-row:1; line-height:1.2; padding:0;
            border:1px solid var(--line); background:var(--bg); color:var(--muted); font-size:12px; font-weight:700;}
  .ctr .unk.on{background:#f59e0b; border-color:#f59e0b; color:#1f2937; font-weight:800;}
  /* 「わからない」が入のあいだは、その枠の数を数えない（数は「？」にする）。
     ★counter-2.1.1: 薄くするのは枠と背景だけにした。＋1・−1 は押せない状態の色（上の :disabled）になるので、
     opacity を重ねがけすると文字が読めなくなる */
  .ctr.unkon .val{border-color:var(--line); background:#141d33;}
  .ctr.unkon .val b{color:var(--muted);}
  .board .plus{background:var(--board);}  .board .val{border-color:var(--board);}
  .alight .plus{background:var(--alight);} .alight .val{border-color:var(--alight);}
  /* ★counter-2.1.1: 乗ってきた人・降りた人の2枠をまとめた入れもの。
     縦画面では今までどおり縦に並ぶ（すき間は .inner と同じ）。横画面だけ左右に並べる（下の @media） */
  .pair{display:flex; flex-direction:column; gap:inherit;}

  /* ★counter-2.1.1: min-height を足した。画面を詰める @media で padding を減らしても、
     押せる高さが 44px を下回らないようにするため */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:44px; border:none; border-radius:14px;
       padding:15px; font-size:16px; font-weight:800; color:#fff;}
  .btn.primary{background:#16a34a;}
  /* ★counter-2.0.6: 人数アプリへ移るボタン。送信（緑）と間違えないよう、ヘッダの「かえりに切り替える」と同じ青にする */
  .btn.go{background:#2563eb;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:700; font-size:15px;}
  .btn:active{filter:brightness(.9);}
  .btn:disabled{opacity:.5;}
  /* ★2026-10-07: 降りた人の＋1 から離す（揺れる車内で＋1を続けて押す指がずれて送信しないように）
     ★counter-2.1.1: 「わからない」が降りた人の枠の下に来たので、ここを 26px → 42px に広げた。
     送信までのすき間は 40.8px → 約60px になる。＋1 のあとに効く700ミリ秒の歯止めは
     「わからない」を押したときには働かないので、すべった指がそのまま送信に当たっていた。
     ★counter-2.2.0: 1行になっても、枠のいちばん下は「わからない」と＋1・−1 の行で変わらないので、
     ここはそのまま。縦画面のすき間は今までどおり約60px になる。
     縦画面を詰める @media でも、ここだけは詰めない（横画面は下の landscape で詰める） */
  #sendBtn{margin-top:42px;}
  /* ★counter-2.1.1: かえり（?dir なし）で車内人数アプリへ戻るボタン。数えている最中に押すものではないので、
     ヘッダではなく記録の一覧の下に置く。送信（緑）と見分けがつくよう、ヘッダのボタンと同じ青の控えめな見た目にする */
  .gobtm{display:block; width:100%; min-height:44px; margin:14px 0 0; padding:11px;
         border:1px solid #2563eb; border-radius:12px; background:rgba(37,99,235,.14);
         color:var(--ink); font-size:14px; font-weight:700;}
  .gobtm:active{background:rgba(37,99,235,.3);}
  .gobtm:disabled{opacity:.5;}
  /* ★counter-2.1.1: 確認用アカウントだけに出す、ゆき／かえりの切り替え。
     参加者のボタンと見分けがつくよう、枠線を点線にして控えめにする */
  .gobtm.quiet{border:1px dashed var(--line); background:transparent; color:var(--muted); font-size:13px;}
  .gobtm.quiet:active{background:var(--line);}

  /* 記録一覧 */
  .log{margin-top:6px; border-top:1px solid var(--line);}
  .lhead{font-size:12px; color:var(--muted); padding:9px 2px; display:flex; justify-content:space-between; border-bottom:1px solid var(--line);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:18px 10px;}
  .logrow{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #1e2a3d;}
  .lt{flex:0 0 auto; width:42px; font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted);}
  .lmid{flex:1 1 auto; min-width:0;}
  .lstop{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lcount{font-size:12px; color:var(--muted);}
  .ptag{font-size:10.5px; font-weight:800; color:#1f2937; background:#f59e0b; border-radius:999px; padding:1px 7px; margin-left:4px; vertical-align:1px;}
  .lstat{flex:0 0 auto; font-size:11.5px; color:var(--muted); text-align:right;}
  .lstat.ok{color:#34d399;} .lstat.pend{color:#fbbf24;} .lstat.rec{color:#60a5fa;}
  .linkbtn{display:block; margin:14px auto 0; border:none; background:transparent; color:var(--muted);
           font-size:12px; text-decoration:underline; padding:8px;}

  /* 終点 */
  .endbox{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px 14px; text-align:center;}
  .endbox .endt{font-size:20px; font-weight:800; line-height:1.5;}
  .endnote{margin-top:14px; font-size:15px; font-weight:800; line-height:1.5; color:#34d399;}
  .endnote.warn{background:#7c2d12; color:#fed7aa; border-radius:10px; padding:10px 12px; font-size:16px;}
  /* ★counter-2.0.6: ゆき（?dir=out）の古い画面を開いたときの案内（もうかえりに進んでいる） */
  .movelead{margin:12px 0 0; font-size:14.5px; line-height:1.6; color:var(--muted);}

  /* バス停の一覧（下から出す） */
  .sheet{position:fixed; inset:0; z-index:40; background:rgba(2,6,23,.72); display:flex; align-items:flex-end; justify-content:center;}
  .sheet[hidden]{display:none;}
  .sheetin{width:100%; max-width:480px; max-height:92%; background:var(--panel); border-radius:16px 16px 0 0;
           display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom,0px);}
  .sheethead{flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); font-size:15px;}
  .sheetlist{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:8px 10px 12px;}
  .sp{display:flex; align-items:center; gap:10px; width:100%; min-height:46px; padding:6px 10px; margin:0 0 5px;
      border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); text-align:left; font-size:15px;}
  .sp.on{border-color:#2563eb; background:rgba(37,99,235,.22);}
  .sp:active{background:var(--line);}
  .spn{flex:0 0 auto; width:22px; text-align:right; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;}
  .spname{flex:1 1 auto; min-width:0; font-weight:700;}
  .spsent{flex:0 0 auto; font-size:11px; color:#34d399;}

  .statusbar{flex:0 0 auto; padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px)); font-size:12px; color:var(--muted);
             text-align:center; border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .statusbar.warn{background:#7c2d12; color:#fed7aa;}
  /* ★counter-2.0.1: 位置情報が拒否されている・大まかなときは、帯を押して直し方の画面を出す（index.html と同じ） */
  .statusbar.caution{background:#78350f; color:#fde68a;}
  .statusbar.act{display:flex; align-items:center; justify-content:center; white-space:normal; line-height:1.35;
                 min-height:calc(44px + env(safe-area-inset-bottom,0px)); cursor:pointer;}
  .statusbar.act .sbmsg{font-weight:800; text-decoration:underline; text-underline-offset:2px;}
  .statusbar.act .sbmsg::after{content:" ›";}
  .statusbar.act:active{filter:brightness(1.2);}
  .statusbar .sbnw{white-space:nowrap;}   /* 版の文字（counter-2.0.1）などを途中で折り返さない */
  /* 直し方の画面（下から出す）。★counter-2.0.2: 手順は1つだけ大きく出す（index.html と同じ） */
  .gh{position:fixed; inset:0; z-index:60; background:rgba(2,6,23,.78); display:flex; align-items:flex-end; justify-content:center;}
  .gh[hidden]{display:none;}
  .ghin{width:100%; max-width:480px; max-height:92%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
        background:var(--panel); color:var(--ink); border-radius:16px 16px 0 0; padding:14px 16px calc(10px + env(safe-area-inset-bottom,0px));}
  .ghin h2{margin:0 0 4px; font-size:17px;}
  .ghlead{margin:0 0 8px; font-size:13.5px; line-height:1.5; color:var(--muted);}
  .ghbox{margin:0 0 10px; padding:9px 11px; border:1px solid #f59e0b; border-radius:10px; font-size:14px; line-height:1.55;}
  .ghpath{margin:0 0 8px; padding:9px 12px; border:1px solid rgba(37,99,235,.6); border-radius:10px; background:rgba(37,99,235,.14);
          font-size:16px; font-weight:700; line-height:1.6;}
  .ghin h2 + .ghpath{margin-top:8px;}   /* 拒否のときは見出しのすぐ下が手順 */
  .ghpath .ghc{display:inline-block; max-width:100%;}
  .ghpath .ghar{color:var(--muted); font-weight:400;}
  .ghpath.sm{margin:0 0 6px; padding:0; border:none; background:none; font-size:13.5px; line-height:1.5;}
  .ghafter{margin:0 0 4px; font-size:14px; line-height:1.5;}
  .ghdev{margin:6px 0 2px; font-size:12px; font-weight:800; color:var(--muted);}
  .ghsteps{margin:0 0 6px; padding-left:1.4em; font-size:13.5px; line-height:1.5;}
  .ghsteps li{margin:0 0 4px;}
  .ghmore{margin:0; font-size:13px;}
  .ghmore summary{padding:10px 0; color:var(--muted); font-weight:700; cursor:pointer;}
  .ghmsg{min-height:18px; margin:2px 0 6px; font-size:14px; font-weight:800; line-height:1.45; color:#fbbf24;}
  .ghmsg:empty{min-height:0; margin:0 0 6px;}
  .ghbtns{display:flex; flex-direction:column; gap:8px;}
  .ghbtns + .ghmore{margin-top:4px;}
  .ghbtns button{min-height:48px; border-radius:12px; font-size:15px; font-weight:800;}
  .ghbtns button[hidden]{display:none;}
  .ghretry{border:none; background:#2563eb; color:#fff;}
  .ghreload,.ghclose{border:1px solid var(--line); background:transparent; color:var(--ink);}
  .toast{position:fixed; left:12px; right:12px; bottom:44px; margin:0 auto; width:fit-content; transform:translateY(12px); opacity:0;
         background:#16a34a; color:#fff; padding:10px 18px; border-radius:12px; font-size:14px; font-weight:700; text-align:center;
         transition:all .2s ease; pointer-events:none; z-index:50;}
  .toast.show{opacity:1; transform:translateY(0);}

  /* ログイン（index.html と同じ見た目） */
  .login{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; overflow-y:auto;}
  .login h1{font-size:22px; margin:0;}
  .login p{color:var(--muted); font-size:14px; margin:0; max-width:340px; line-height:1.5;}
  .authform{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;}
  .afield{width:100%; padding:13px; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:16px; font-family:inherit;}
  .pwshow{display:flex; align-items:center; gap:.5em; font-size:13px; color:var(--muted); cursor:pointer; text-align:left;}
  .pwshow input{width:1.1em; height:1.1em;}
  .authform .btn{background:#2563eb;}
  #authNote{color:#fca5a5; font-size:12px; min-height:16px; margin:0;}

  /* ── 小さい画面（iPhone 390x664 / iPhone SE 375x667 / 360x640 / 320x568 など） ──
     ★counter-2.1.1: 「わからない」で枠ごとに1行（2枠で約112px）増えたのに、詰める指定が
     @media (max-height:520px) の中にしかなく、664・667 の端末には当たっていなかった。
     練習モード・送り直し・位置情報オフが出ていても「送信」まで見えるよう、ここで詰める。
     詰めるのは すき間・余白・ヘッダの高さ だけで、押せる高さは 44px を下回らない
     （＋1 は 56px、−1・わからない・変える は 44px のまま）。
     降りた人の「わからない」と「送信」のあいだ（#sendBtn の margin-top）は逆に広げてある */
  @media (max-height:700px){
    header{padding-top:calc(4px + env(safe-area-inset-top,0px)); padding-bottom:4px; gap:8px;}
    .hactions{gap:6px;}
    .brand .staff{font-size:10.5px;}
    /* 長いIDでもヘッダが2行に増えないよう、念のため幅を止める（参加者のIDは1文字なので収まる） */
    .sess{max-width:110px; overflow:hidden; text-overflow:ellipsis;}
    /* 横の余白と文字だけ小さくする（押せる高さは 31.6px → 32.4px で、小さくしていない）。
       ヘッダが1行で収まれば 40px ぶん短くなる */
    .legsw{padding:8px; font-size:12px;}
    .iconbtn{padding:8px; font-size:12px;}
    .scroll{padding-top:5px;}
    .inner{gap:4px;}
    .blk{padding:5px 9px 6px;}
    .lbl{margin-bottom:3px;}
    :root{--plush:56px;}
    .pbanner{padding:6px 9px; font-size:12px;}
    .renote{margin-top:3px; font-size:12.5px;}
    .btn{padding:11px;}
    #sendBtn{margin-top:50px;}   /* 詰めたぶん、ここは広げたままにする（すき間は約60px） */
    .statusbar{padding-top:5px;}
    .login{gap:14px; padding:16px;}
    .afield{padding:11px;}
  }
  /* iPhone の Safari は上下のバーが出ていると、375×667 の端末でも見えている高さが 560 前後まで下がる。
     320×568 の端末もここに入る。＋1 は 46px まで、ほかの押せるものは 44px のまま */
  @media (max-height:620px){
    :root{--plush:46px;}
    .stopname{font-size:18px;}
    .ctr .val b{font-size:28px;}
    .blk{padding:3px 8px 4px;}
    .lbl{margin-bottom:2px;}
    .inner{gap:2px;}
    .pbanner{padding:5px 7px; font-size:11px; line-height:1.3;}
    .btn{padding:9px;}
    #sendBtn{margin-top:46px;}
  }
  /* ★2026-10-07: 320x460 など（Safari の上下のバーが出ている小さい端末）でも、練習中を含めて送信がスクロールなしで見えるように */
  @media (max-height:520px){
    header{padding-top:calc(3px + env(safe-area-inset-top,0px)); padding-bottom:3px;}
    .scroll{padding-top:4px;}
    .inner{gap:2px;}
    .blk{padding:3px 8px 4px;}
    .lbl{margin-bottom:2px;}
    :root{--plush:44px;}
    .chg{min-height:44px;}   /* ★counter-2.1.1: 38px だと押せる高さが足りないので 44px に戻した */
    .stopname{font-size:17px;}
    .ctr .val b{font-size:26px;}
    .expbar .pz,.expbar .prac{padding-top:5px; padding-bottom:5px;}
    .pbanner{padding:4px 8px; font-size:11.5px;}
    .btn{padding:9px;}
    #sendBtn{margin-top:44px;}
    .statusbar{padding-top:5px;}
  }
  /* ★counter-2.1.1: 横画面（667×375 など）は縦が足りないので、乗ってきた人・降りた人の枠を左右に並べる。
     縦に積んだままだと、降りた人の＋1 がスクロールしないと押せなかった。
     枠の中の並び（数／＋1／−1、その下にわからない）は縦画面と同じまま変えない。
     ★counter-2.3.0: 横画面でも、1バス停ぶんをスクロールなしで最後まで通せるようにした。
     使わない余白と見出しを削って 62px ぶんの縦を作り、そのぶんを
     「わからない」と「送信」のあいだ（32px → 60px）に回している。
     ＋1 の高さ（--plush＝44px）と、押せる高さ 44px はどこも下げていない */
  @media (orientation:landscape) and (max-height:520px){
    .inner{max-width:640px;}
    .pair{flex-direction:row; gap:8px;}
    .pair > .blk{flex:1 1 0; min-width:0;}
    /* 枠が半分の幅になるので、数の枠をさらに細くし、列のすき間も 16px にして3つのボタンの幅を残す */
    .ctr{grid-template-columns:58px repeat(3, minmax(0,1fr)); column-gap:16px;}
    .ctr .plus{font-size:26px;}
    /* 幅が足りないので「1つ戻す」は隠す。aria-label の「−1 1つ戻す」は残るので、読み上げでは今までどおり */
    .ctr .minus .mh{display:none;}
    /* 「わからない」は5文字ぶん（5em）の幅が要る。横画面は列が 64px しかないので字を 11px にする
       （文字の幅 55px ／ 入る幅 62.1px） */
    .ctr .unk{font-size:11px;}
    /* ★counter-2.2.0: 横画面で「送信」が画面からはみ出していたので、ここだけさらに詰める。

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

}
/* ★counter-2.0.6: ゆき（?dir=out＝偶数組）の画面なのに、その日はもうかえりに進んでいる。
   偶数組は桃山台駅で人数アプリのかえりに移るが、古い ?dir=out のタブが残っていると、
   そこから ＋1 や「送信」を押せてしまい、かえりの便が「計数研究ゆき」として記録されてしまう。
   この形になっていたら入力と送信を止め、人数アプリへ移る案内（renderMovedOn）を出す */
function legMovedOn(){
  return DIR==="out" && getDaily(LEG_KEY)==="kaeri" && isCountStudy();
}

/* ---------------- 記録（1バス停＝1件） ---------------- */
// ★2026-10-07: メモリに持たず毎回端末から読み直し、読む・変える・書くを updRecs の1か所で行う。
//   2つのタブで開いていると、古い一覧で上書きして、もう片方のタブの未送信の記録を消してしまうため
function lsArr(k){ try{ const a=JSON.parse(lsGet(k)||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function recs(){ return lsArr(REC_KEY); }
function updRecs(fn){ const a=recs(); fn(a); lsSet(REC_KEY, JSON.stringify(a)); }
function updRec(sid, fn){ updRecs(a=>{ const x=a.find(r=>r.sid===sid); if(x) fn(x); }); }
function getRec(sid){ return recs().find(x=>x.sid===sid); }
// ui_sessions の surveyor_id は送った瞬間のログインで決まる。別の人の記録を自分の名前で送らないよう、記録した人で分ける
function myRecs(){ const u=user && user.id; return recs().filter(x=>!x.uid || x.uid===u); }
// ★2026-10-07: 人数アプリ（ゆき）で送れずに残った回答・操作ログ。桃山台駅で移ったあと参加者は人数アプリを開き直さないので、ここから送る
const IDX_OUTBOX = "uistudy_outbox_v1", IDX_SESS = "uistudy_sessions_v1";
function idxLeft(){ return lsArr(IDX_OUTBOX).filter(x=>x && x.ready).length + lsArr(IDX_SESS).length; }
function pendN(){ return myRecs().filter(x=>x.state==="pend").length + idxLeft(); }

/* ---------------- 今の往路（run） ---------------- */
let run = null;
function loadRun(){ try{ return JSON.parse(lsGet(RUN_KEY)||"null"); }catch(e){ return null; } }
function saveRun(){ lsSet(RUN_KEY, run ? JSON.stringify(run) : null); }
function newRun(){
  run = { run_id:uuid(), dir:DIR, uid:user.id, day:todayStr(), started_at:new Date().toISOString(),
          next:0,      // 次に出すバス停（0〜21。22＝終点まで送った）
          sent:{},     // 送ったバス停（練習は除く）。送り直しの判定に使う
          draft:null,
          stash:null };  // 送り直しのあいだ退避しておく、数えている途中のバス停
  saveRun();
}
// ★2026-10-07: ほかのタブが同じ往路を進めていたら読み直す（古い run で上書きしない）
function reloadRun(){
  if(!user) return false;
  const raw=lsGet(RUN_KEY);
  if(!raw || (run && raw===JSON.stringify(run))) return false;
  const r=loadRun();
  if(!r || r.dir!==DIR || r.uid!==user.id) return false;   // 別の方向・別の人の run は触らない（タブどうしで作り直し合わない）
  run=r; render(); return true;
}
// 同じ日・同じ人・同じ方向なら続きから。再読込や人数アプリとの行き来で途中の記録を失わない
function ensureRun(){
  if(!run){
    const r=loadRun();
    if(r && r.dir===DIR && r.uid===user.id && r.day===todayStr()){
      run=r;
      if(run.draft){ ev("screen_view", { stop:stopObj(run.draft.cur), screen_w:innerWidth, screen_h:innerHeight, restored:true }); saveRun(); }
    }
  }
  if(!run || run.uid!==user.id) newRun();
}
// 1バス停ぶんの入力途中の値。押すたびに保存するので、ページが落ちても消えない
function ensureDraft(){
  if(!run.draft) newDraft(Math.min(run.next, STOPS.length-1), null);
  return run.draft;
}
// prev があれば送り直し：前回の値から始める（数え漏れた人だけ＋1すればよい）
// ★counter-2.1.0: 前回が「わからない」だったバス停（board / alight が null）は、「わからない」が入った状態から始める
function newDraft(i, prev){
  const now=Date.now(), sug=Math.min(run.next, STOPS.length-1);   // 終点のあとの送り直しは終点が「出したバス停」
  run.draft = { shown_at:now, started_at:new Date(now).toISOString(), sug:sug, cur:i,
                board:(prev && prev.board!=null) ? prev.board : 0,
                alight:(prev && prev.alight!=null) ? prev.alight : 0,
                board_unknown:!!(prev && prev.board==null),
                alight_unknown:!!(prev && prev.alight==null),
                resend:!!prev,
                prev:prev ? { board:prev.board, alight:prev.alight } : null,
                taps:0, cnt:{ board_plus:0, board_minus:0, alight_plus:0, alight_minus:0,
                              board_unknown_taps:0, alight_unknown_taps:0 },
                first_at:null, traj:[], events:[] };
  ev("screen_view", Object.assign({ stop:stopObj(i), screen_w:innerWidth, screen_h:innerHeight }, prev ? { resend:true, prev:run.draft.prev } : {}));
  saveRun();
}
// この往路でそのバス停に最後に送った値
function lastSent(i){
  const a=myRecs().filter(x=>x.run_id===run.run_id && !x.practice && x.row && x.row.context.stop.seq===i+1);
  return a.length ? a[a.length-1] : null;
}
function ev(type, data){ const d=run.draft; d.events.push(Object.assign({ dt:Date.now()-d.shown_at, type:type }, data||{})); }
// 最初の操作。ここから15秒さかのぼって位置を残し始める
function firstOp(){
  const d=run.draft; if(d.first_at!=null) return;
  d.first_at=Date.now();
  d.traj=preBuffer.filter(p=>p._ms>=d.first_at-PRE_MS).map(({_ms,...pt})=>pt);
  grabOneShot();   // すぐしまわれても代表点が1つ残るよう、その場で一発測位（index.html と同じ）
}

/* ---------------- 位置情報（index.html の startSampling / grabOneShot と同じ） ---------------- */
const preBuffer = [];      // 直近30秒の測位
let fins = [];             // 送信後に位置をとり続けている記録 {sid, until, send_sec, traj, timer}
let watchId=null, lastSampleTs=0;
// ★counter-2.0.1: 位置情報の状態を1か所で持つ（index.html と同じ）
//   null（まだ測っていない）| "on"（取得中）| "ok" | "slow"（時間がかかっている）| "denied"（拒否）| "coarse"（大まか）| "none"（端末が非対応）
// iPhone の Safari は、端末やブラウザの設定で位置情報が切られていると、許可を聞かずに拒否する（error.code===1）。
// ページから設定は開けないので、帯を押せるようにして直し方を見せ、直ったら測位をやり直す。位置情報がなくても記録・送信はできる
let geoState=null, geoDeniedAt=0, geoCoarseN=0, geoWanted=false;
const GEO_COARSE_M = 1000, GEO_COARSE_N = 3;   // 精度が 1000m より悪い点が3回続いたら「大まか」
const GEO_RETRY_MS = 10000;                    // 拒否のあと、画面の描き直しのたびに聞き直さない（押したとき・画面に戻ったときは聞き直す）
function setGeo(st){
  if(geoState===st) return;
  geoState=st; setStatus();
  // 直し方の画面を開いたまま直ったら（設定から戻った・許可が変わった）、閉じて知らせる
  if(st==="ok" && geoHelpOpen()){ closeGeoHelp(); toast(GEO_T.fixed); }
}
function geoView(){
  switch(geoState){
    case "on":     return { msg:GPS_ON };
    case "ok":     return { msg:GPS_OK };
    case "slow":   return { msg:GPS_SLOW };
    case "denied": return { msg:GPS_DENIED, warn:true, act:true };
    case "coarse": return { msg:GPS_COARSE, caution:true, act:true };
    case "none":   return { msg:GPS_NO, warn:true };
  }
  return { msg:"" };
}
// 位置がとれた（watch・一発測位・もう一度ためす のどれでも）。精度を見て OK か「大まか」かを決める
function geoFix(p){
  const acc = p && p.coords ? p.coords.accuracy : null;
  if(acc!=null && acc>GEO_COARSE_M) geoCoarseN++; else geoCoarseN=0;
  if(geoCoarseN>=GEO_COARSE_N) setGeo("coarse");
  else if(geoState!=="coarse" || geoCoarseN===0) setGeo("ok");   // 大まかの表示は、精度が戻ったときだけ消す
  // 拒否で watch を止めていたあとに一発測位が通った（許可された）ら、測位をやり直す
  if(watchId==null && geoWanted && !document.hidden) startSampling(true);
}
// 拒否された。watch を止めて watchId を空にする（残すと startSampling が二度と watchPosition を呼ばない）
function geoDenied(){
  stopSampling();
  geoDeniedAt=Date.now(); geoCoarseN=0;
  setGeo("denied");
  geoAutoHelp();
}
function onGeoPos(p){
  geoFix(p);
  const now=Date.now();
  if(now-lastSampleTs < SAMPLE_MS-300) return;   // 約2.5秒間隔に間引き
  lastSampleTs=now;
  addPoint(toPt(p));
}
function toPt(p){
  const c=p.coords;
  return { t:Math.floor(Date.now()/1000), lat:+c.latitude.toFixed(6), lng:+c.longitude.toFixed(6), acc:Math.round(c.accuracy),
           hdg:(c.heading!=null && !isNaN(c.heading)) ? Math.round(c.heading) : null,     // 進行方位(度)
           spd:(c.speed!=null && !isNaN(c.speed)) ? +c.speed.toFixed(1) : null };          // 速度(m/s)
}
function pushPt(tj, pt){   // 同じ時刻（2秒以内）の重複は入れない。時刻順を保つ
  if(tj.some(q=>Math.abs(q.t-pt.t)<2)) return false;
  tj.push(pt); tj.sort((a,b)=>a.t-b.t); return true;
}
function addPoint(pt){
  const now=Date.now();
  preBuffer.push(Object.assign({ _ms:now }, pt));
  while(preBuffer.length && preBuffer[0]._ms<now-KEEP_MS) preBuffer.shift();
  const d=run && run.draft;
  if(d && d.first_at!=null && pushPt(d.traj, pt)) saveRun();
  fins.forEach(f=>{ if(now<=f.until) pushPt(f.traj, pt); });
}
// force: 拒否の直後でも聞き直す（「もう一度ためす」・画面に戻ったとき・許可が変わったとき）
function startSampling(force){
  if(watchId!=null) return;
  if(!navigator.geolocation){ setGeo("none"); return; }
  geoWanted=true;
  if(geoState==="denied" && !force && Date.now()-geoDeniedAt<GEO_RETRY_MS) return;
  if(!geoState) setGeo("on");
  watchId = navigator.geolocation.watchPosition(
    onGeoPos,
    (e)=>{   // 許可拒否と、車内でありがちなタイムアウト/一時的な取得不可を区別。許可されなくても記録はできる
      if(e && e.code===1) geoDenied(); else setGeo("slow");
    },
    { enableHighAccuracy:true, maximumAge:3000, timeout:15000 }
  );
}
function stopSampling(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
function restartSampling(){ stopSampling(); startSampling(true); }
function grabOneShot(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((p)=>{ addPoint(toPt(p)); geoFix(p); },
    ()=>{}, { enableHighAccuracy:true, maximumAge:10000, timeout:15000 });
}
// 画面に戻ったとき（設定アプリから戻ったときなど）。Android の Chrome などは戻ったあと少し遅れて許可が変わることがあるので、拒否のままなら少しあとにもう一度聞く。
// iPhone の Safari（iPhone のほかのブラウザも同じ中身）は、一度拒否したページでは読み込み直すまで拒否を返し続ける
// （WebKit の Geolocation::startRequest。許可に変わっても作り直さない）。聞き直しても害はないので端末を問わず行い、
// iPhone では直し方の画面の「ページを読み込み直す」で直してもらう（openGeoHelp。index.html と同じ）
function geoResume(){
  startSampling(true);
  setTimeout(()=>{ if(!document.hidden && user && geoState==="denied" && watchId==null) startSampling(true); }, 1200);
}
// 許可の状態が見られるブラウザでは、変わったら自動で測位をやり直す（設定で許可した → 帯が OK に戻る）。見られなければ watch のエラーで見分ける。
// iPhone の Safari は、許可に変わっても同じページでは拒否のままなので、ここでは直らない（読み込み直しが要る。geoResume を参照）
function watchGeoPermission(){
  try{
    if(!(navigator.permissions && navigator.permissions.query)) return;
    navigator.permissions.query({ name:"geolocation" }).then((st)=>{
      const on=()=>{
        if(!geoWanted || document.hidden) return;
        if(st.state==="granted"){ if(geoState==="denied" || watchId==null) restartSampling(); }
        else if(st.state==="denied"){ if(geoState!=="denied") geoDenied(); }
      };
      try{ st.addEventListener("change", on); }catch(e){ st.onchange=on; }
    }).catch(()=>{});
  }catch(e){}
}

/* ---------------- 位置情報の直し方（帯を押すと出す。拒否に気づいたら、その日1回だけ自動で出す。index.html と同じ） ---------------- */
const GEOHELP_KEY = "geo_help_auto_v1";   // 自動で出した日（人数アプリ・乗降アプリで共通）
let geoHelpAuto=false, geoHelpWhy="denied";
// 数えている最中（このバス停で＋1などを押した）は自動で出さない。バス停の一覧を開いているときも
function geoBusy(){ return !!(run && run.draft && run.draft.first_at!=null) || !$("sheet").hidden; }
function geoDevice(){
  const ua=navigator.userAgent||"";
  // iPadOS は Mac の Safari と名乗るので、タッチの有無で見分ける
  if(/iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)) return "ios";
  return /Android/i.test(ua) ? "android" : "other";
}
// LINE などのアプリの中のブラウザ（見分けられる範囲で）
function geoInApp(){
  const ua=navigator.userAgent||"";
  if(/\bLine\//.test(ua)) return "LINE";
  if(/Instagram/.test(ua)) return "Instagram";
  if(/FBAN|FBAV|FB_IAB/.test(ua)) return "Facebook";
  if(/Discord/i.test(ua)) return "Discord";
  if(/MicroMessenger/i.test(ua)) return "WeChat";
  return null;
}
function geoHelpOpen(){ const g=$("geoHelp"); return !!(g && !g.hidden); }
function geoAutoHelp(){
  if(geoState!=="denied" || geoHelpOpen() || geoHelpAuto || !user || geoBusy()) return;
  geoHelpAuto=true;                              // 端末に保存できなくても、ページを開いている間は1回まで
  if(getDaily(GEOHELP_KEY)) return;
  setDaily(GEOHELP_KEY, "1");
  openGeoHelp();
}
function openGeoHelp(){
  const g=$("geoHelp"), t=GEO_T, dev=geoDevice(), app=geoInApp();
  geoHelpWhy = (geoState==="coarse") ? "coarse" : "denied";
  const coarse = geoHelpWhy==="coarse";
  // iPhone で拒否のときは、「もう一度ためす」を出さず「ページを読み込み直す」を主なボタンにする。
  // 一度拒否したページでは、設定を直しても読み込み直すまで拒否が返るため（geoResume の注を参照）
  const reloadFirst = (dev==="ios" && !coarse);
  // ★counter-2.0.2: 手順は1つだけ大きく出す（拒否なら step、大まかなら precise）。配列は「→」でつなぐ（index.html と同じ）
  const path=(d)=>{
    const s=(coarse ? t.precise : t.step)[d];
    return Array.isArray(s) ? s.map((x,i)=>`<span class="ghc">${i ? `<span class="ghar">→ </span>` : ""}${x}</span>`).join(" ") : s;
  };
  // 手順のあとの一言は、押すボタンを名前で書く（ボタンは2つあるので「下のボタン」では決まらない）
  const mainBtn = reloadFirst ? t.reload : t.retry;
  // アプリ（LINE など）の中では、Safari / Chrome で開き直す一言だけにする。拒否のときは見出しの下の一言を出さない
  const body = app ? `<div class="ghbox" id="ghInApp">${t.inapp(app, dev)}</div>` :
    `${coarse ? `<p class="ghlead" id="ghLead">${t.lead_coarse}</p>` : ""}
      <div class="ghpath" id="ghStep">${path(dev)}</div>
      <p class="ghafter" id="ghAfter">${coarse ? t.after_coarse(mainBtn) : t.after(mainBtn)}</p>`;
  // アプリの中では青いボタンを出さない。開き直すのはアプリのメニューなので、ページのボタンを本文の操作に見せない（押したときの動きは同じ）
  const mainCls = app ? "ghreload" : "ghretry";
  // たたんだもの（ボタンの下）。「それでも直らないとき」は拒否のときだけ。ほかの端末も手順1つ
  const more = app ? "" :
    (coarse ? "" : `<details class="ghmore" id="ghStill"><summary>${t.still}</summary><ul class="ghsteps">${t.still_steps[dev].map(x=>`<li>${x}</li>`).join("")}</ul></details>`) +
    `<details class="ghmore" id="ghOther"><summary>${t.more}</summary>${["ios","android","other"].filter(d=>d!==dev).map(d=>`<div class="ghdev">${t.dev[d]}</div><div class="ghpath sm">${path(d)}</div>`).join("")}</details>`;
  g.innerHTML = `<div class="ghin" role="dialog" aria-modal="true" aria-labelledby="ghTitle">
      <h2 id="ghTitle">${coarse ? t.title_coarse : t.title}</h2>
      ${body}
      <p class="ghmsg" id="ghMsg" aria-live="polite"></p>
      <div class="ghbtns">
        <button type="button" class="${mainCls}" id="ghRetry"${reloadFirst ? " hidden" : ""}>${t.retry}</button>
        <button type="button" class="${reloadFirst ? mainCls : "ghreload"}" id="ghReload"${reloadFirst ? "" : " hidden"}>${t.reload}</button>
        <button type="button" class="ghclose" id="ghClose">${t.close}</button>
      </div>
      ${more}
    </div>`;
  g.hidden=false;
  g.onclick=(e)=>{ if(e.target===g) closeGeoHelp(); };
  $("ghRetry").onclick=geoRetry; $("ghReload").onclick=geoReload; $("ghClose").onclick=closeGeoHelp;
  try{ $(reloadFirst ? "ghReload" : "ghRetry").focus({ preventScroll:true }); }catch(e){}
}
function closeGeoHelp(){
  const g=$("geoHelp"); if(!g || g.hidden) return;
  g.hidden=true; g.innerHTML="";
  const s=$("status"); if(s && s.classList.contains("act")) try{ s.focus({ preventScroll:true }); }catch(e){}
}
// 「もう一度ためす」。押したその処理の中で getCurrentPosition を呼ぶ（許可の確認を出せるのは、利用者の操作の中だけのブラウザがある）
function geoRetry(){
  const t=GEO_T, say=(m)=>{ const el=$("ghMsg"); if(el) el.textContent=m; };
  if(!navigator.geolocation) return;
  say(t.trying);
  navigator.geolocation.getCurrentPosition((p)=>{
    stopSampling();                        // 古い watch を捨てて測位をやり直す
    const acc=p.coords ? p.coords.accuracy : null;
    onGeoPos(p);                           // この点も軌跡に入れる。状態が OK になれば setGeo が画面を閉じる
    startSampling(true);
    if(geoHelpOpen()) say(geoHelpWhy==="coarse" && acc>GEO_COARSE_M ? t.still_coarse : "");
    if(geoHelpOpen() && geoState==="ok"){ closeGeoHelp(); toast(t.fixed); }
  }, (e)=>{
    if(e && e.code===1){
      geoDenied();
      say(t.still_off);
      const r=$("ghReload"); if(r) r.hidden=false;   // 一度拒否したページでは、読み込み直すまで拒否を返し続けるブラウザがある（iPhone はかならずそう）
    } else { say(t.wait); restartSampling(); }
  }, { enableHighAccuracy:true, maximumAge:0, timeout:15000 });
}
// 読み込み直す前に、送信後の位置とりを打ち切って送る（数えている途中の値は端末に残っているので消えない）
async function geoReload(){
  finalizeAll();
  await Promise.race([flush(), new Promise(r=>setTimeout(r,3000))]);
  location.reload();
}
// 代表位置＝送信時刻に一番近い点
function repPoint(tj, sec){
  if(!tj.length) return { lat:null, lng:null, gps_accuracy:null, gps_fixed_at:null };
  let best=tj[0];
  for(const q of tj) if(Math.abs(q.t-sec) < Math.abs(best.t-sec)) best=q;
  return { lat:best.lat, lng:best.lng, gps_accuracy:best.acc, gps_fixed_at:new Date(best.t*1000).toISOString() };
}

/* 画面を消さない。対応していない端末では黙って諦める */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on){ if(!wakeLock && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen");
              wakeLock.addEventListener("release", ()=>{ wakeLock=null; }); } }
    else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}

/* ---------------- 送信（ui_sessions に insert。送れなければ端末に残す） ---------------- */
let flushP=null, flushAgain=false;
// 同時に2本走らせない（同じ記録を2回 insert しない）。走っている間に呼ばれたら、終わったあとにもう1周する
function flush(){
  if(flushP){ flushAgain=true; return flushP; }
  flushP=(async()=>{
    try{ do{ flushAgain=false; await flushLocked(); }while(flushAgain); }
    finally{ flushP=null; }
  })();
  return flushP;
}
// ★2026-10-07: タブをまたいでも送信は同時に1本だけ（2つのタブが同時に「まだ届いていない」と確かめて2回 insert しないように）。
//   ほかのタブが10秒たっても離さない（止まったタブが持ったまま等）ときは、待たずに送る（送れないままより、二重のほうがあとで直せる）
async function flushLocked(){
  if(!(navigator.locks && navigator.locks.request && window.AbortController)) return flushOnce();
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(), 10000);
  try{ await navigator.locks.request("counter-flush", { signal:ac.signal }, async()=>{ clearTimeout(tm); await flushOnce(); }); }
  catch(e){ if(e && e.name==="AbortError") await flushOnce(); else console.error(e); }
  finally{ clearTimeout(tm); }
}
async function flushOnce(){
  if(!user || !sb) return;
  const uid=user.id, live=fins.map(f=>f.sid);
  // 記録中のまま残った記録（送信直後にページが閉じた等）は、とれたところまでの位置で送る。ほかのタブで記録中のものは待つ
  if(recs().some(x=>x.state==="rec" && !live.includes(x.sid) && Date.now()-x.at>POST_MS+6000))
    updRecs(a=>a.forEach(x=>{ if(x.state==="rec" && !live.includes(x.sid) && Date.now()-x.at>POST_MS+6000) x.state="pend"; }));
  let ok=true;
  for(const sid of myRecs().filter(x=>x.state==="pend" && (!x.uid || x.uid===uid)).map(x=>x.sid)){
    const it=getRec(sid); if(!it || it.state!=="pend") continue;   // ほかのタブが送った
    ok=false;
    try{ ok=await sendOne(it); }
    catch(err){ console.error("[ui_sessions] insert失敗:", err?.code||"", err?.message||err); }
    if(!ok) break;   // 電波がないときは残りも通らない。次の機会にまとめて送る
    updRec(sid, x=>{ x.state="ok"; x.sent_at=Date.now(); });
  }
  if(ok){ try{ await sendIdxLeft(); }catch(err){ console.error("[人数アプリの未送信] insert失敗:", err?.code||"", err?.message||err); } }
  renderLog(); setStatus();
}
async function sendOne(it){
  const retry=(it.tries||0)>0;
  updRec(it.sid, x=>{ x.tries=(x.tries||0)+1; });   // 送る前に数える。送信中にページが閉じても、次は届いていないかを先に確かめる
  if(retry && await already("ui_sessions", "session_id", it.sid)) return true;   // 前回の送信は届いていた。二重に入れない
  await ins("ui_sessions", it.row);
  return true;
}
// ★2026-10-07: 人数アプリの送信待ち（回答＝ui_responses、操作ログ＝ui_sessions）。人数アプリが途中まで送っていたかもしれないので、届いていないかを先に確かめる
const BOOT_AT=Date.now();
async function sendIdxLeft(){
  // 人数アプリから移った直後は、人数アプリが打ち切った送信がまだ届く途中かもしれないので少し待つ
  const wait=5000-(Date.now()-BOOT_AT);
  if(wait>0){ if(idxLeft()) setTimeout(flush, wait+300); return; }
  for(const it of lsArr(IDX_OUTBOX).filter(x=>x && x.ready)){
    if(it.rec && !await already("ui_responses", "client_id", it.cid)) await ins("ui_responses", it.rec);
    lsSet(IDX_OUTBOX, JSON.stringify(lsArr(IDX_OUTBOX).filter(x=>x.cid!==it.cid)));
  }
  for(const r of lsArr(IDX_SESS)){
    if(!await already("ui_sessions", "session_id", r.session_id)) await ins("ui_sessions", r);
    lsSet(IDX_SESS, JSON.stringify(lsArr(IDX_SESS).filter(x=>x.session_id!==r.session_id)));
  }
}
// 返事が来ないまま止まらないよう20秒で打ち切る（届いていたかは次に select で確かめる）
function tmo(p){ return Promise.race([p, new Promise((_, j)=>setTimeout(()=>j(new Error("timeout")), 20000))]); }
async function already(table, col, v){
  const { data, error } = await tmo(sb.from(table).select(col).eq(col, v).limit(1));
  if(error) throw error;
  return !!(data && data.length);
}
async function ins(table, row){
  const { error } = await tmo(sb.from(table).insert(Object.assign({}, row, { client_submitted_at:new Date().toISOString() })));
  if(error) throw error;
}
// 送信後の位置とりを終えて「送る」状態にする
function finalize(sid, quiet){
  const f=fins.find(x=>x.sid===sid); if(!f) return;
  fins=fins.filter(x=>x!==f); clearTimeout(f.timer);
  updRec(sid, it=>{
    const c=it.row.context;
    c.trajectory=f.traj;
    Object.assign(c, repPoint(f.traj, f.send_sec));
    if(it.state==="rec") it.state="pend";
  });
  renderLog(); setStatus();
  if(quiet) return;
  flush().then(()=>{
    const x=getRec(sid), ok=!!(x && x.state==="ok");
    toast(ok ? "送信しました" : "端末に保存しました（あとで自動で送ります）", ok ? "#16a34a" : "#f59e0b");
  });
}
function finalizeAll(){ fins.slice().forEach(f=>finalize(f.sid, true)); }

/* ---------------- 1バス停ぶんの操作 ---------------- */
// ★2026-10-07: 指が残ったまま2回目が当たるのを防ぐ。1回目で画面が作り直されると、2回目が新しい画面のボタンに当たる
//   （「送信」の2回押しで次のバス停を0人で送る、「変える」の2回押しで一覧の上のバス停を選ぶ、＋1の連打の指がずれて送る）
const SEND_AFTER_SHOW = 1000, SEND_AFTER_TAP = 700, PICK_AFTER_OPEN = 500;
let shownAt=0, lastTapAt=0, sheetAt=0;
/* ★counter-2.2.1: 送信の歯止めを画面に出す。
   これまでは歯止めに当たると何も知らせずに捨てていたので、参加者からは「押したのに無反応」に見え、
   1回押して目を離すとそのバス停の記録が残らなかった */
function sendBlockMs(){
  const n=Date.now();
  return Math.max(0, SEND_AFTER_SHOW-(n-shownAt), SEND_AFTER_TAP-(n-lastTapAt));
}
let sendLockTimer=null;
function refreshSendLock(){
  const b=$("sendBtn"); if(!b) return;
  const ms=sendBlockMs();
  b.disabled = ms>0;
  if(sendLockTimer){ clearTimeout(sendLockTimer); sendLockTimer=null; }
  if(ms>0) sendLockTimer=setTimeout(refreshSendLock, ms+30);
}
// ★counter-2.1.0: その枠が「わからない」かどうか
function isUnk(k){ return !!(run && run.draft && run.draft[k+"_unknown"]); }
function bump(k, delta){
  // ★counter-2.0.6: ほかのタブでかえりに進んだら、この古いゆきの画面では数えさせない
  if(legMovedOn()){ render(); return; }
  const d=run.draft;
  if(isUnk(k)) return;             // ★counter-2.1.0: 「わからない」のあいだは数えない（ボタンも止めてある）
  if(delta<0 && d[k]<=0) return;   // 0未満にしない
  firstOp();
  d[k]+=delta; d.taps++;
  d.cnt[k+(delta>0?"_plus":"_minus")]++;
  ev(k+(delta>0?"+1":"-1"), { value:d[k] });
  saveRun(); showVals();
  lastTapAt=Date.now(); refreshSendLock();
  if(delta>0 && navigator.vibrate) navigator.vibrate(8);
}
/* ★counter-2.1.0: 「わからない」の入／切。車内人数アプリ（count.html）には「わからない」があるので、
   こちらにも足して数え方をそろえる。乗ってきた人・降りた人のそれぞれに1つずつ置き、
   どちらが数えにくかったかを分けて見られるようにする。
   入のあいだは数を「？」にして ＋1・−1 を止めるが、それまでの数は消さずに持っておき、切に戻すとそのまま戻る。
   送信そのものは止めない（片方だけでも、両方でも送れる）。
   ★counter-2.2.1: ただし lastTapAt を動かす。2.2.0 で横画面の「わからない」と「送信」が
   31.8px まで近づき、指がすべってそのまま送られるおそれが出たため */
function setUnknown(k, on){
  if(legMovedOn()){ render(); return; }
  const d=run.draft;
  if(!!d[k+"_unknown"]===on) return;
  firstOp();
  const before=d[k];
  d[k+"_unknown"]=on; d.taps++;
  d.cnt[k+"_unknown_taps"]=(d.cnt[k+"_unknown_taps"]||0)+1;
  ev("unknown", { field:k, on:on, value_before:before });
  lastTapAt=Date.now(); refreshSendLock();
  saveRun(); showVals();
  if(navigator.vibrate) navigator.vibrate(8);
}
function pickStop(i){
  if(Date.now()-sheetAt < PICK_AFTER_OPEN) return;
  closeSheet();
  let d=run.draft;
  if(d && i===d.cur) return;
  const prev = run.sent[i] ? lastSent(i) : null;
  if(prev){
    // ★2026-10-07: 送ったバス停の送り直し。数えている途中の値は退避し、送り直しが済んだら戻す
    if(d && !d.resend) run.stash=d;
    newDraft(i, prev);
  }else{
    // 送り直しをやめた（まだ送っていないバス停を選んだ）。退避していた途中の値に戻す
    if(d && d.resend){
      run.draft=d=run.stash; run.stash=null;
      if(d) ev("screen_view", { stop:stopObj(d.cur), screen_w:innerWidth, screen_h:innerHeight, restored:true });
    }
    if(!d) newDraft(i, null);   // 終点の画面から選んだ
    else if(i!==d.cur){         // 停留所の取り違えの直し。値は持ち越す
      firstOp(); d.taps++;
      ev("stop_change", { from:stopObj(d.cur), to:stopObj(i) });
      d.cur=i;
    }
  }
  saveRun(); renderStop(false);
}
function send(){
  // ★counter-2.0.6: 押した瞬間にも見る。ほかのタブでかえりに進んだあと、この古いゆきの画面から送らせない
  if(legMovedOn()){ render(); return; }
  const d=run.draft, now0=Date.now();
  // ★counter-2.2.1: 歯止めに当たったときは、黙って捨てずに知らせる
  if(sendBlockMs()>0){ refreshSendLock(); toast("少し待ってから「送信」を押してください","#f59e0b"); return; }
  /* ★counter-2.1.0: 「わからない」の枠は数を送らず null にする。0 は「誰もいなかった」なので分けて残す。
     どちらの枠がわからなかったかは board_unknown / alight_unknown でわかる。
     「0人で送りますか？」の確かめは、両方とも数えられて0人のときだけ出す（わからないは0人ではない） */
  const bUnk=!!d.board_unknown, aUnk=!!d.alight_unknown;
  const bv=bUnk ? null : d.board, av=aUnk ? null : d.alight;
  let zero=null;
  if(bv===0 && av===0){
    zero = confirm("乗った人・降りた人とも0人で送りますか？") ? "ok" : "cancel";
    if(zero==="cancel"){ firstOp(); d.taps++; ev("send", { board:0, alight:0, zero_confirm:"cancel" }); saveRun(); return; }
  }
  firstOp(); d.taps++;
  ev("send", { board:bv, alight:av, board_unknown:bUnk, alight_unknown:aUnk, zero_confirm:zero });
  const now=Date.now(), sec=Math.floor(now/1000), prac=isPractice();
  const resend=!!run.sent[d.cur];   // この往路で送ったバス停を選び直した（分析では同じ run・同じバス停の最後の記録を使う）
  const sid=uuid(), traj=d.traj.slice(), ls=legSet();
  const row = {
    session_id: sid,
    started_at: d.started_at,
    outcome: "submit",
    // ★counter-2.0.4: 組（group）と確認用アカウントかどうか（test_account）も入れる。人数アプリの studyTag と同じ中身にそろえる
    // ★counter-2.0.6: 区間をいつ・どう決めたか（leg_by / leg_at）も入れる。人数アプリの studyTag と同じで、
    //   あとから「かえりの便をゆきとして記録していないか」を見分けるため。まだ決めていなければ null
    variant: { study:"count", round:null, leg:LEG, group:idGroup(), test_account:isTestAccount(),
               label:LABEL, method:"flow", app:"counter", practice:prac,
               login_id: loginId() || null,   // ★counter-2.0.3: 送信を押した時点でログインしていたID
               leg_by: ls.by, leg_at: ls.at },
    context: Object.assign({
      run_id: run.run_id, dir: DIR, stop: stopObj(d.cur), stop_suggested: stopObj(d.sug),
      stop_changed: d.cur!==d.sug, resend: resend, board: bv, alight: av,
      // ★counter-2.1.0: どちらの枠を「わからない」で送ったか。board / alight が null の理由がこれでわかる
      board_unknown: bUnk, alight_unknown: aUnk,
      posture: getDaily(POSTURE_KEY), trajectory: traj }, repPoint(traj, sec), {
      screen_w: innerWidth, screen_h: innerHeight, app_version: VERSION,
      device_id: deviceId() }),   // ★counter-2.0.3
    summary: { t_total: now-d.shown_at, t_first: d.first_at-d.shown_at, taps_total: d.taps,
               board_plus: d.cnt.board_plus, board_minus: d.cnt.board_minus,
               alight_plus: d.cnt.alight_plus, alight_minus: d.cnt.alight_minus,
               // ★counter-2.1.0: 「わからない」を押した回数（入・切の両方を数える。迷った様子を見るため）
               board_unknown_taps: d.cnt.board_unknown_taps||0, alight_unknown_taps: d.cnt.alight_unknown_taps||0 },
    events: d.events
  };
  updRecs(a=>a.push({ sid, uid:user ? user.id : null, state:"rec", at:now, run_id:run.run_id, stop:STOPS[d.cur], board:bv, alight:av,
                       practice:prac, row }));
  // 練習は次のバス停に進めない（のりばで練習しても、本番は今のバス停から始まるように）
  if(!prac){
    // 前に送ったバス停を選び直して送ったときは、次に出すバス停を変えない。★2026-10-07: 戻すこともしない（終点のあとに送っても終点の画面に戻る）
    if(!resend) run.next=Math.max(run.next, d.cur+1);
    run.sent[d.cur]=(run.sent[d.cur]||0)+1;
  }
  // ★2026-10-07: 送り直しが済んだら、退避していた数えている途中のバス停に戻す
  run.draft = (d.resend && run.stash) ? run.stash : null; run.stash=null;
  if(run.draft) ev("screen_view", { stop:stopObj(run.draft.cur), screen_w:innerWidth, screen_h:innerHeight, restored:true });
  saveRun();
  // 送ったあと約4秒は位置をとり続けてから送る
  const f={ sid, until:now+POST_MS, send_sec:sec, traj:traj.slice() };
  f.timer=setTimeout(()=>finalize(sid, false), POST_MS);
  fins.push(f);
  render(true);
}

  if(!quiet && !confirm(toKaeri

      : "車内人数アプリに移りますか？\nここまでの記録は端末に残るので、戻れば続きから数えられます")){ back(); return; }

  finalizeAll();
  await Promise.race([flush(), new Promise(r=>setTimeout(r,3000))]);
  const n=myRecs().filter(x=>x.state==="pend").length;
  if(n && !confirm(`未送信が ${n}件あります。残りは車内人数アプリが続けて送ります。このまま車内人数アプリに移りますか？`)){
    back(); return;

/* ---------------- ログイン（index.html の normLogin / submitAuth と同じ。新規登録は無し） ---------------- */
const ID_DOMAIN = "id.local";
function normLogin(v){ v=(v||"").trim(); return (v && !v.includes("@")) ? v.toLowerCase()+"@"+ID_DOMAIN : v; }
function toHalf(v){   // 全角で打たれたIDを半角に直す
  return (v||"").replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); })
                .replace(/　/g, " ").trim();
}
const ID_RE = /^[A-Za-z0-9_-]{1,20}$/;
function renderLogin(){
  main.innerHTML=`
    <div class="login">
      <h1>乗降アプリ</h1>
      <p>カードの ID とパスワードでログインしてください。</p>
      <div class="authform">
        <input class="afield" id="fId" type="text" inputmode="latin" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="ID（カードに書いてある文字）">
        <input class="afield" id="fPass" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）">
        <label class="pwshow"><input type="checkbox" id="fShow"> パスワードを表示して確かめる</label>
        <button class="btn" id="authBtn">ログイン</button>
        <p id="authNote"></p>
      </div>
    </div>`;
  $("fShow").onchange=(e)=>{ $("fPass").type = e.target.checked ? "text" : "password"; };
  $("fId").addEventListener("blur", ()=>{ $("fId").value=toHalf($("fId").value); });
  $("authBtn").onclick=submitAuth;
  setStatus();
}
function authNote(msg){ const n=$("authNote"); if(n) n.textContent=msg||""; }
async function submitAuth(){
  if(!configured){ toast(NOTCONF,"#dc2626"); return; }
  const fid=$("fId"); fid.value=toHalf(fid.value);
  const rawId=fid.value.trim(), pass=$("fPass").value||"";
  const email=normLogin(rawId);
  authNote("");
  if(!email){ authNote("IDを入力してください"); return; }
  if(!rawId.includes("@") && !ID_RE.test(rawId)){ authNote("IDは半角英数・ハイフン・アンダースコアで20文字までにしてください"); return; }
  if(pass.length<6){ authNote("パスワードは6文字以上にしてください"); return; }
  const btn=$("authBtn"); btn.disabled=true; btn.textContent="処理中…";
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password:pass });
    if(error){
      const m=(error.message||"").toLowerCase();
      if(m.includes("not confirmed")||m.includes("confirm")) authNote("このアカウントはまだ有効になっていません。実験者に伝えてください。");
      else authNote("IDまたはパスワードが違います");
      throw error;
    }
  }catch(e){
    if(!$("authNote") || !$("authNote").textContent) authNote(e.message||"error");
  }finally{
    const b=$("authBtn"); if(b){ b.disabled=false; b.textContent="ログイン"; }
  }
}

/* ---------------- 起動 ---------------- */
async function boot(){
  // 前に記録中のまま閉じた記録は、とれたところまでの位置で送る（★2026-10-07: flushOnce で。ほかのタブで記録中のものを横取りしないよう）
  $("outBtn").onclick=async()=>{
    // 乗車中の誤タップ対策（index.html と同じ）
    if(!confirm("ログアウトします。次に使うときはIDとパスワードの入力が必要です。よろしいですか？")) return;
    // ★counter-2.0.6: 何を消すかはサインアウトの前に決めておく（サインアウトすると user が消え、IDがわからなくなる）
    const countDay = getDaily(STUDY_KEY)==="count", testAcct = isTestAccount();
    finalizeAll();
    await Promise.race([flush(), new Promise(r=>setTimeout(r,3000))]);   // 送れるものは先に送る（ログアウト後は送れない）
    if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
    setDaily(POSTURE_KEY, null); setDaily(PRACTICE_KEY, null);
    // ★2026-10-07: ログインは人数アプリと共有しているので、人数アプリの着席/立席・練習・回目・区間も消す（index.html のログアウトと同じ）
    // ★counter-2.0.6: ただし計数研究の日は、回目と区間の4つを残す。消すと「まだゆき」に戻ってしまい、
    //   ログインし直したあと、かえりの便をゆきとして記録してしまうため。
    //   確認用アカウント（組の表に無いID）のときは、今までどおり全部消す（回目や区間を変えながら確かめるため）
    const keepLeg = countDay && !testAcct;
    ["countapp_posture_v1","countapp_practice_v1","countapp_testgroup_v1"]
      .concat(keepLeg ? [] : ["countapp_round_v1","countapp_leg_v1","countapp_leg_at_v1","countapp_leg_set_v1"])
      .forEach(k=>lsSet(k, null));
    user=null; run=null; render();
  };
  // ★counter-2.1.1: ヘッダに残すのは、ゆき（?dir=out）の「かえりに切り替える」だけ。
  //   かえりの「車内人数アプリへ」と確認用の向き切り替えは、画面のいちばん下に移した（botHtml / wireBot）
  // ★counter-2.0.6: 引数なしで呼ぶ（onclick にそのまま渡すと、クリックの情報が quiet として渡り、確認が出なくなる）
  $("toIdxBtn").onclick=()=>goCountApp();
  // ★counter-2.0.1: 位置情報が拒否・大まかなときは、帯を押すと直し方の画面を出す
  const stEl=$("status");
  stEl.addEventListener("click", ()=>{ if(stEl.classList.contains("act")) openGeoHelp(); });
  stEl.addEventListener("keydown", (e)=>{ if(stEl.classList.contains("act") && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); openGeoHelp(); } });
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape" && geoHelpOpen()) closeGeoHelp(); });
  watchGeoPermission();
  updateHeader();
  if(!configured){ render(); return; }
  sb.auth.onAuthStateChange((evName, sess)=>{
    const prevUid = user ? user.id : null;
    user = sess ? sess.user : null;
    const uid = user ? user.id : null;
    // ログイン/ログアウトが実際に変わったときだけ画面を作り直す（トークン更新などで入力中の画面を壊さない）
    if(uid!==prevUid){ run=null; render(); }
    else updateHeader();
    if(user) setTimeout(flush, 0);   // このコールバックの中で Supabase を待つと固まることがあるので、外に出す
  });
  const { data:{ session } } = await sb.auth.getSession();
  const prevUid = user ? user.id : null;
  user = session ? session.user : null;
  if(!prevUid || !user || prevUid!==user.id) render();
  if(user) flush();

  // 画面を離れたら送信後の位置とりを打ち切って送る／戻ったら測位を再開して未送信を送り直す
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){ finalizeAll(); stopSampling(); flush(); }
    // ★counter-2.0.6: ブラウザの戻る（画面が残ったまま戻ってくる）でも見る。もうかえりに進んでいたら案内に切り替える
    else if(user && legMovedOn()){ render(); flush(); }
    else if(user){ reloadRun(); geoResume(); flush(); if(run && run.next<STOPS.length) keepAwake(true); }   // ★2.0.1: 拒否のあとでも聞き直す
  });
  window.addEventListener("pagehide", ()=>finalizeAll());
  window.addEventListener("online", ()=>flush());
  // ★2026-10-07: ほかのタブで記録・往路が変わったら読み直す
  window.addEventListener("storage", (e)=>{
    if(e.key===RUN_KEY) reloadRun();
    if(e.key===REC_KEY || e.key===IDX_OUTBOX || e.key===IDX_SESS){ renderLog(); setStatus(); }
    // ★counter-2.0.6: ほかのタブでかえりに進んだら、このゆきの画面を案内に切り替える（古い画面から送らせない）
    if(e.key===LEG_KEY && legMovedOn()) render();
  });
  // ★2026-10-07: 未送信があるあいだは20秒ごとにも送り直す（電波が戻っても online が来ない端末がある。終点の画面は開いたままにしてもらう）
  setInterval(()=>{ if(user && !document.hidden && (pendN() || myRecs().some(x=>x.state==="rec"))) flush(); }, 20000);
}
boot();
</script>
</body>
</html>
