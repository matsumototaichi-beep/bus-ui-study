<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バス混雑度 計測</title>
<style>
  :root{
    --c1:#16a34a; --c2:#65a30d; --c3:#ca8a04; --c4:#ea580c; --c5:#dc2626; --c6:#991b1b;
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#f1f5f9; --muted:#94a3b8;
    --ctlh:56px;   /* 人数入力部品の高さ（画面サイズで@mediaが上書き） */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  /* iOS Safari のツールバー伸縮で下部が隠れないように */
  @supports (height:100dvh){ html,body{height:100dvh;} }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden;
  }
  header{flex:0 0 auto; padding:7px 12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); background:var(--panel);}
  .brand{flex:0 0 auto; font-size:14px; font-weight:800; display:flex; flex-direction:column; line-height:1.15;}
  .brand .staff{font-size:10px; font-weight:600; color:var(--muted);}
  .nav{flex:1 1 auto; min-width:0; display:flex; gap:4px; justify-content:center;}
  .navb{flex:0 0 auto; white-space:nowrap; border:none; background:transparent; color:var(--muted); font-family:inherit; font-size:13px; font-weight:700; padding:7px 12px; border-radius:9px;}
  .navb.on{background:var(--bg); color:var(--ink);}
  .hactions{flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:7px;}
  .sess{min-width:0; font-size:11px; color:var(--muted); line-height:1.2; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sess b{color:var(--ink); font-weight:600;}
  .iconbtn{flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:10px; padding:7px 10px; font-size:13px; font-weight:600;}

  /* データ一覧 */
  .feed{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
  .feedhead{flex:0 0 auto; padding:10px 12px; border-bottom:1px solid var(--line);}
  .feedhead h2{margin:0 0 3px; font-size:16px;}
  .feedhead p{margin:0 0 9px; font-size:12px; color:var(--muted);}
  .feedctl{display:flex; gap:8px; align-items:center;}
  .feedctl select{flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px; font-family:inherit;}
  .feedctl button{flex:0 0 auto; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; padding:9px 13px; font-size:13px; font-weight:700; font-family:inherit;}
  .feedlist{flex:1 1 auto; min-height:0; overflow-y:auto; padding:6px 10px 16px;}
  .frow{display:flex; align-items:center; gap:11px; padding:11px 8px; border-bottom:1px solid #1e2a3d;}
  .ft{flex:0 0 auto; width:70px; font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--muted); line-height:1.25;}
  .fmid{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:9px;}
  .flabel{font-size:14px; font-weight:700;}
  .fcount{font-size:13px; color:var(--muted);}
  .ftag{flex:0 0 auto; font-size:11px; font-weight:700; color:#93c5fd; background:#1e3a5f; padding:3px 9px; border-radius:999px;}
  .fcount-badge{margin-left:auto; font-size:12px; color:var(--muted);}

  main{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; position:relative;}
  .backbtn{position:absolute; top:10px; left:10px; z-index:5; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700; font-family:inherit; display:inline-flex; align-items:center; gap:6px;}
  .backbtn:active{background:var(--line);}

  .picker{flex:0 0 auto; padding:8px 10px; border-bottom:1px solid var(--line);}
  .ptitle{font-size:12px; color:var(--muted); margin:0 2px 6px;}
  .grid{display:grid; grid-template-columns:1fr; gap:7px; max-width:300px; margin:0 auto;}
  /* 実験バー：実験コード（同じ便に乗った人の紐づけ）と着席/立席。未設定は橙で目立たせる */
  .expbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; max-width:300px; margin:0 auto 6px;}
  .expcode{border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:9px; padding:6px 10px; font-size:12px; font-family:inherit; white-space:nowrap;}
  .expcode b{color:var(--ink);}
  .expcode.unset{border-color:#f59e0b; color:#fbbf24;} .expcode.unset b{color:#fbbf24;}
  .expedit{display:flex; gap:6px;}
  .expinput{width:92px; padding:5px 8px; border-radius:9px; border:1px solid #2563eb; background:var(--bg); color:var(--ink); font-size:16px; font-family:inherit;}
  .expok{border:none; background:#2563eb; color:#fff; border-radius:9px; padding:6px 12px; font-size:13px; font-weight:700; font-family:inherit;}
  .posture{display:flex; flex:0 0 auto; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
  .posture.unset{border-color:#f59e0b;}
  .pz{border:none; background:transparent; color:var(--muted); padding:6px 11px; font-size:12px; font-weight:700; font-family:inherit;}
  .pz.on{background:#2563eb; color:#fff;}
  /* 練習モード：切り忘れが最悪なので、オンの間は必ず目に入る色にする */
  .prac{border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:9px; padding:6px 10px; font-size:12px; font-family:inherit; white-space:nowrap;}
  .prac.on{background:#f59e0b; border-color:#f59e0b; color:#1f2937; font-weight:800;}
  .pbanner{display:block; width:100%; max-width:300px; margin:0 auto 6px; border:none; border-radius:10px;
           background:#f59e0b; color:#1f2937; padding:8px 10px; font-size:12.5px; font-weight:800;
           line-height:1.35; text-align:center; font-family:inherit;}
  .card{
    border:none; border-radius:12px; color:#fff; font-family:inherit; padding:0 16px; min-height:56px;
    display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:14px;
    transition:transform .06s ease; text-align:left;
  }
  .card:active{transform:scale(.97);}
  .card .num{font-size:23px; font-weight:800; width:30px; text-align:center; flex:0 0 auto;}
  .card .cardtext{display:flex; flex-direction:row; align-items:baseline; gap:8px; line-height:1.15;}
  .card .lbl{font-size:14px; font-weight:800;}
  .card .rng{font-size:12px; opacity:.9; font-weight:600;}
  .c1{background:var(--c1);} .c2{background:var(--c2);} .c3{background:var(--c3);}
  .c4{background:var(--c4);} .c5{background:var(--c5);} .c6{background:var(--c6);}

  .log{flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 10px 14px; background:var(--bg);}
  .lhead{position:sticky; top:0; z-index:3; background:var(--bg); font-size:12px; color:var(--muted); padding:9px 12px; margin:0 -10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:28px 10px;}
  .logrow{display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid #1e2a3d;}
  .chip{flex:0 0 auto; width:26px; height:26px; border-radius:7px; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .lt{flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); width:42px;}
  .lmid{flex:1 1 auto; min-width:0;}
  .lcount{font-size:15px; font-weight:700;}
  .lsub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lstat{flex:0 0 auto; font-size:11px; color:var(--muted); text-align:right;}
  .lstat.ok{color:#34d399;} .lstat.pend{color:#fbbf24;} .lstat.rec{color:#60a5fa;}

  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:16px; overflow-y:auto;}

  /* 停留所オートコンプリート */
  .stopwrap{width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; text-align:left;}
  .stopfield{position:relative;}
  .stopfield label{font-size:12px; color:var(--muted); display:block; margin:0 2px 4px;}
  .stopinput{width:100%;}
  .stoplist{position:absolute; left:0; right:0; top:100%; z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-top:4px; max-height:220px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .stoprow{touch-action:pan-y;}
  .stoplist.show{display:block;}
  .stoprow{padding:11px 12px; font-size:14px; border-bottom:1px solid #26344a;}
  .stoprow:last-child{border-bottom:none;}
  .stoprow:active{background:var(--line);}
  .stoprow .dist{float:right; color:var(--muted); font-size:12px;}
  .stopsel{font-size:12px; color:#34d399; margin:4px 2px 0; min-height:15px;}
  .stopsel .clr{color:#fca5a5; margin-left:8px; text-decoration:underline;}
  .stopsrc{font-size:10px; color:var(--muted); margin:2px 2px 0;}
  .center h2{margin:0; font-size:18px; font-weight:700;}
  .center .hint{color:var(--muted); font-size:13px; margin:0;}
  /* 選んだクラス＋その目安人数（入力の制限ではない） */
  .selchip{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ink);
           background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 14px 4px 5px; max-width:100%;}
  .selchip .chip{width:24px; height:24px;}
  .selchip .rng{font-size:12px; font-weight:600; color:var(--muted);}
  /* −と＋の間に人数を挿す（ボタンが何を増減させるのか一目で分かるように） */
  /* ±1/±5 の4ボタン。±10 を外したのは、実データ(n=6597)で削減が平均0.03タップ・寄与2.8%しかない一方、
     7列だとボタン幅が 35.3px(320px端末)/41.7px(375px端末) と全機種で HIG 44pt を割るため（原則A7）。
     5列なら 49.1/58.1px で基準を満たす */
  .stepper{display:grid; grid-template-columns:repeat(2,1fr) 1.7fr repeat(2,1fr); gap:5px; align-items:stretch; width:100%; max-width:420px;}
  .stepper button{height:var(--ctlh); padding:0; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:15px; font-weight:800; font-family:inherit; font-variant-numeric:tabular-nums;}
  /* 人数の表示枠：ここに数字が入ると一目で分かるよう常に囲う。未入力は破線・入力後は青の実線 */
  .count{display:flex; align-items:center; justify-content:center; border-radius:12px;
         border:2px solid #2563eb; background:var(--bg); color:var(--ink);
         font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
  .count.noval{border-style:dashed; border-color:var(--line); color:var(--muted); font-size:22px;}
  .stepper button.mi{color:#fca5a5;} .stepper button.pl{color:#93c5fd;}
  .stepper button:active{background:var(--line);}
  /* テンキー方式（UI条件）：OSのキーボードは使わない。
     表示遅延と画面占有が交絡して「遅いのはキーボード待ちのせい」と反論されるため */
  .numwrap{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; max-width:290px;}
  .numwrap .count{width:100%; height:var(--ctlh);}
  .numpad{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%;}
  .numpad button{height:calc(var(--ctlh) - 8px); min-height:44px; padding:0; border-radius:12px;
                 border:1px solid var(--line); background:var(--panel); color:var(--ink);
                 font-size:20px; font-weight:700; font-family:inherit; font-variant-numeric:tabular-nums;}
  .numpad button.npfn{font-size:16px; color:#fca5a5;}
  .numpad button:active{background:var(--line);}
  /* 2桁を超えるキーは無効。無反応だと不安なので枠を一瞬光らせる */
  .count.full{animation:cflash .18s ease;}
  @keyframes cflash{0%,100%{border-color:#2563eb;}50%{border-color:#f59e0b;}}
  /* ★UI研究:「わからない」は入力方式の外側に置く。テンキーには C(クリア) があるがステッパーには
     「—」に戻す手段が無く、そのままでは条件間で機能が非対称になる（先行実験で「わからない」が
     「0人」として記録された）。両条件でまったく同じ要素にすることで、標的サイズの交絡も持ち込まない */
  .unknownrow{display:flex; justify-content:center; width:100%; max-width:420px;}
  .unknownrow button{min-height:44px; padding:0 20px; border-radius:12px; border:1px dashed var(--line);
                     background:transparent; color:var(--muted); font-size:14px; font-weight:700;
                     font-family:inherit;}
  .unknownrow button:active{background:var(--line);}
  .unknownrow button.on{border-style:solid; border-color:#2563eb; color:var(--ink); background:rgba(37,99,235,.16);}
  .row{display:flex; gap:10px; width:100%; max-width:420px;}
  .row.actions{flex-direction:column;}   /* 通常は縦積み。縦の短い端末では横並びに切替（下部@media） */
  /* 送信/スキップはスクロール領域の下端に固定。入力方式によって到達コストが変わると
     「テンキーが遅い」のが入力ではなくスクロールのせいになってしまうため */
  .row.actions{position:sticky; bottom:0; z-index:2; background:var(--bg); padding:8px 0 2px;}
  .btn{flex:1; border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:700; font-family:inherit; color:#fff;}
  .btn.primary{background:#2563eb;} .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn.gh{background:#24292f; display:inline-flex; align-items:center; justify-content:center; gap:10px;}
  .btn:active{filter:brightness(.9);}
  .btn:disabled{opacity:.5;}

  .statusbar{flex:0 0 auto; padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px)); font-size:12px; color:var(--muted); text-align:center; border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .statusbar.warn{background:#7c2d12; color:#fed7aa;}

  .toast{position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(12px); opacity:0; background:#16a34a; color:#fff; padding:10px 18px; border-radius:12px; font-size:14px; font-weight:700; transition:all .2s ease; pointer-events:none; z-index:30;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* login screen */
  .login{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center;}
  .login h1{font-size:22px; margin:0;}
  .reseticon{font-size:42px; line-height:1;}
  .login p{color:var(--muted); font-size:14px; margin:0; max-width:340px; line-height:1.5;}
  .login .btn{flex:0 0 auto; width:100%; max-width:320px;}
  .authtabs{display:flex; gap:6px; width:100%; max-width:320px;}
  .atab{flex:1; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:11px; padding:10px; font-size:14px; font-weight:700; font-family:inherit;}
  .atab.on{background:var(--panel); color:var(--ink); border-color:#2563eb;}
  .authform{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;}
  .afield{width:100%; padding:13px; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:16px; font-family:inherit;}
  .authform .btn{max-width:none;}
  #authNote{color:#fca5a5; font-size:12px; min-height:16px; margin:0;}
  /* ── 小さい画面（iPhone SE 375x667 / 320x568 など）向けの詰め ── */
  @media (max-height:700px){
    header{padding:5px 10px;}
    .picker{padding:6px 10px;}
    .ptitle{margin-bottom:5px;}
    .grid{gap:6px;}
    .card{min-height:48px; padding:0 13px; gap:11px;}
    .card .num{font-size:20px; width:26px;}
    .card .lbl{font-size:13px;} .card .rng{font-size:11px;}
    .logrow{padding:7px 6px;}
    .lhead{padding:7px 12px;}
    /* 人数入力画面：上寄せ＋余白圧縮（戻るボタンに重ならない高さを確保） */
    .center{justify-content:flex-start; gap:10px; padding:56px 12px 14px;}
    .center h2{font-size:16px;}
    .center .hint{font-size:12px;}
    :root{--ctlh:50px;}
    .stepper button{font-size:14px;}
    .numpad button{font-size:18px;}
    .count{font-size:24px;} .count.noval{font-size:20px;}
    .stopwrap{gap:8px;}
    .afield{padding:11px;}
    .stoplist{max-height:150px;}
    .btn{padding:13px; font-size:14px;}
    .backbtn{top:8px; left:8px; padding:7px 12px; font-size:13px;}
  }
  /* ── さらに縦が短い画面（iPhone SE 1st 320x568 / 横向き） ── */
  @media (max-height:620px){
    .center{gap:8px; padding:48px 12px 10px;}
    :root{--ctlh:46px;}
    .numwrap{gap:5px;}
    .numpad{gap:5px;}
    .numpad button{font-size:17px;}
    .count{font-size:22px;} .count.noval{font-size:19px;}
    .stopwrap{gap:6px;}
    .afield{padding:9px 11px;}   /* font-size は16pxのまま＝iOSの自動ズーム回避 */
    .stoplist{max-height:132px;}
    .btn{padding:11px; font-size:14px;}
    .row.actions{flex-direction:row;}
    #sendBtn{flex:2;} #skipBtn{flex:1;}
  }
  /* 320px級ではナビ「データ一覧」が切れるので、優先度の低いログイン名を落として幅を譲る */
  @media (max-width:360px){ .sess{display:none;} }
  @media (max-width:400px){
    header{gap:7px; padding:7px 9px;}
    .brand{font-size:13px;}
    .navb{font-size:12px; padding:6px 9px;}
    .sess{max-width:70px; font-size:10px;}
    .iconbtn{padding:6px 8px; font-size:12px;}
  }
  @media (max-width:360px){
    .brand{font-size:13px;}
    .navb{font-size:12px; padding:6px 9px;}
    .sess{max-width:70px; font-size:10px;}
    .iconbtn{padding:6px 8px; font-size:12px;}
    .stepper{gap:4px;}
    .stepper button{font-size:13px;}
    .count{font-size:20px;} .count.noval{font-size:18px;}
    .card{padding:0 11px; gap:9px;}
    .expcode{padding:6px 8px;} .pz{padding:6px 8px;}
  }
</style>
</head>
<body>

<header id="hdr">
  <div class="brand">バス混雑度<span class="staff" id="brandTag">スタッフ調査</span></div>
  <nav class="nav">
    <button class="navb" id="navReport">報告</button>
    <button class="navb" id="navFeed">データ一覧</button>
  </nav>
  <div class="hactions">
    <span class="sess" id="sess"></span>
    <button class="iconbtn" id="langBtn">EN</button>
    <button class="iconbtn" id="outBtn" style="display:none">⎋</button>
  </div>
</header>

<main id="main"></main>

<div class="statusbar" id="status"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="stops.js"></script>
<script>
/* ==========================================================
   バス混雑度 HITL 収集アプリ (Phase A)
   - メール＋パスワードで登録/ログイン(Supabase Auth)
   - 回答者が押すのは「クラス＋人数」だけ
   - 軌跡(約2.5秒間隔・回答前後 約20秒／方位・速度も)/時刻/surveyor_id は自動付与
   - 保存先: Supabase responses（失敗時は端末に退避して再送）
   ---- 下の SUPABASE_URL / ANON_KEY に自分のプロジェクト値を入れる ----
   ========================================================== */
const SUPABASE_URL      = "https://qhfegbptgkgccwdnrnas.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SZKczNkJSCrilMnACZ4Xnw_CV5UeZWN";  // 公開してよい publishable key
const APP_VERSION = "uiStudy-0.7.7";

/* ==========================================================
   UI研究：条件割当（バリアント）と操作ログ
   - 1回答 = 1セッション。開始からの相対ms(dt)で記録（端末時計のズレに非依存）
   - 条件はセッションごとに順番に割当（カウンターバランス）
   ========================================================== */
// UI条件：入力方式 × 初期値 の2要因（各2水準＝4条件）。
// 連続で同じ方式が続かない順に並べてある
const UI_CONDS = [
  { input:"stepper", count_init:"none"   },
  { input:"numpad",  count_init:"median" },
  { input:"stepper", count_init:"median" },
  { input:"numpad",  count_init:"none"   },
];
// ★2026-09-18: URLのクエリパラメータで条件を固定できるようにする
// （例 ?input=stepper 、?input=stepper&init=median）。
// 「入力方式ごとに別URLのアプリを配布し、実験者が渡すURLで条件を決める」運用のため。
// 指定した軸は固定、指定しない軸は今までどおりアプリ内でローテーションする
// （2本に分ける／4本に分けるのどちらでも同じコードで対応できる）。
const URL_QS = new URLSearchParams(location.search);
const FIXED_INPUT = (()=>{ const v=(URL_QS.get("input")||"").toLowerCase(); return (v==="stepper"||v==="numpad") ? v : null; })();
const FIXED_INIT  = (()=>{ const v=(URL_QS.get("init") ||"").toLowerCase(); return (v==="none"||v==="median") ? v : null; })();
function activeConds(){
  const c = UI_CONDS.filter(x =>
    (FIXED_INPUT===null || x.input===FIXED_INPUT) && (FIXED_INIT===null || x.count_init===FIXED_INIT));
  return c.length ? c : UI_CONDS;   // 該当が0件（あり得ないURL指定）なら全条件にフォールバック
}
const UISTUDY_KEY  = "uistudy_sessions_v1";        // 未送信セッションの退避
const UISTUDY_SEQ  = "uistudy_seq_v1";             // 条件割当の通し番号（本番）
const UISTUDY_PSEQ = "uistudy_pseq_v1";            // 同（練習用）。本番の順番を練習で進めないため
const UISTUDY_OFF  = "uistudy_offset_v1";          // 端末ごとの開始位置（順序効果の相殺）

// 端末ごとに違う位置から回し始める。全員が同じ順なら順序効果と条件が区別できないため。
// mod: そのとき実際にローテーションする条件数（activeConds().length）
function condOffset(mod){
  let o = null;
  try{ o = localStorage.getItem(UISTUDY_OFF); }catch(e){}
  if(o === null){
    o = String(Math.floor(Math.random() * mod));
    try{ localStorage.setItem(UISTUDY_OFF, o); }catch(e){}
  }
  return parseInt(o, 10) || 0;
}
// ★2026-09-18: 「割当を覗く(peek)」と「実際に1つ進める(commit)」を分離。
// 以前は pickClass のたびにカウンタを即座に進めていたため、クラスを選んで「戻る」で
// キャンセルしても1コマ消費してしまい、ラテン方格の並びが実際の回答数とずれていた。
// 送信/スキップが確定した時だけ commitVariant() を呼び、キャンセル時は何もしない
// （＝次に同じコマから配られる）ようにする。
function peekVariant(){
  // 練習は専用カウンタを使う。本番のカウンタを進めてしまうと、練習回数が人によって違うぶん
  // 本番データの開始条件がずれ、せっかくのラテン方格が崩れる
  const prac = isPractice();
  const key  = prac ? UISTUDY_PSEQ : UISTUDY_SEQ;
  let n = 0;
  try{ n = parseInt(localStorage.getItem(key) || "0", 10) || 0; }catch(e){}
  const conds = activeConds();
  const off = condOffset(conds.length);
  const c = conds[(n + off) % conds.length];
  return { input: c.input, count_init: c.count_init, seq: n, offset: off,
           url_fixed: { input: FIXED_INPUT, count_init: FIXED_INIT },   // ★どの軸がURLで固定されていたか
           practice: prac };
}
// 送信/スキップが確定した回答についてだけ呼ぶ。カウンタを実際に1つ進める。
// n===variant.seq のときだけ進めるので、同じ variant を誤って2回コミットしても多重には進まない。
function commitVariant(variant){
  if(!variant) return;
  const key = variant.practice ? UISTUDY_PSEQ : UISTUDY_SEQ;
  let n = 0;
  try{ n = parseInt(localStorage.getItem(key) || "0", 10) || 0; }catch(e){}
  if(n === variant.seq){ try{ localStorage.setItem(key, String(n + 1)); }catch(e){} }
}

const POSTURE_KEY  = "uistudy_posture_v1";
// ★UI研究: 練習モード。オンの間の回答は practice:true で記録し、分析から外す。
// 日付で失効させるのは他と同じ（前日オンのまま本番が始まるのを防ぐ）
const PRACTICE_KEY = "uistudy_practice_v1";
function isPractice(){ return getDaily(PRACTICE_KEY) === "1"; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function getDaily(k){
  let raw=null; try{ raw=localStorage.getItem(k); }catch(e){}
  if(!raw) return null;
  const i=raw.lastIndexOf("|");
  return (i>0 && raw.slice(i+1)===todayStr()) ? raw.slice(0,i) : null;
}
function setDaily(k,v){ try{ if(v) localStorage.setItem(k, v+"|"+todayStr()); else localStorage.removeItem(k); }catch(e){} }
function expBarInner(t){
  const pos=getDaily(POSTURE_KEY);
  const pracOn = isPractice();
  return `<div class="posture${pos?"":" unset"}"><button class="pz${pos==="sit"?" on":""}" data-p="sit">${t.sit}</button><button class="pz${pos==="stand"?" on":""}" data-p="stand">${t.stand}</button></div>` +
    `<button id="pracBtn" class="prac${pracOn?" on":""}">${t.prac}</button>`;
}
// 練習中は画面の先頭に大きく出す（実験バーの小さなボタンだけだと切り忘れる）
function pracBanner(t){
  return isPractice() ? `<button id="pracBanner" class="pbanner">${t.prac_banner}</button>` : "";
}
// バーだけ描き直す（renderMainを呼ぶとクラス選択画面の表示時刻 pickerShownAt がリセットされ t_class が狂うため）
function renderExpBar(){
  const el=$("expbar"); if(!el) return;
  el.innerHTML=expBarInner(T[lang]); wireExpBar(); renderPracBanner();
}
// バナーは #expbar の外にあるので別に描き直す（renderMain を呼ぶと t_class が狂う）
function renderPracBanner(){
  const el=$("pracwrap"); if(!el) return;
  el.innerHTML = pracBanner(T[lang]);
  const b=$("pracBanner");
  if(b) b.onclick=()=>{ setDaily(PRACTICE_KEY, null); renderExpBar(); };
}
function wireExpBar(){
  document.querySelectorAll("#expbar .pz").forEach(b=>{ b.onclick=()=>{ setDaily(POSTURE_KEY, b.dataset.p); renderExpBar(); }; });
  const pr=$("pracBtn");
  if(pr) pr.onclick=()=>{ setDaily(PRACTICE_KEY, isPractice()?null:"1"); renderExpBar(); };
}
// 人数画面で最初に値を操作した時刻（＝考えていた時間の目安）
function markFirst(){
  if(LOG && LOG.t_first==null && LOG.count_view_at!=null) LOG.t_first=Math.round(performance.now()-LOG.count_view_at);
}   // クラス選択画面が表示された時刻（熟考時間の参考値）

function logStart(cls, variant){
  LOG = { session_id: uuid(), started_at: new Date().toISOString(), t0: performance.now(),
          variant: variant, events: [], taps: 0, taps_value: 0, corrections: 0,
          t_class: null, t_count: null, t_first: null, count_view_at: null, t_stop: 0, stop_focus_at: null,
          posture: getDaily(POSTURE_KEY),
          practice: variant.practice };
  logEvent("session_start", { congestion_class: cls,
    since_picker_ms: pickerShownAt ? Math.round(performance.now() - pickerShownAt) : null });
}
function logEvent(type, data){
  if(!LOG) return;
  LOG.events.push(Object.assign({ dt: Math.round(performance.now() - LOG.t0), type }, data || {}));
}
function logTap(target){ if(LOG) LOG.taps++; logEvent("tap", { target: target }); }

// セッション確定（submit / skip / abandon）→ 集計してローカル保存＋送信
function finishSession(outcome, extra){
  if(!LOG) return;
  const t_total = Math.round(performance.now() - LOG.t0);
  if(LOG.stop_focus_at != null){ LOG.t_stop += Math.round(performance.now() - LOG.stop_focus_at); LOG.stop_focus_at = null; }
  logEvent("session_end", { outcome: outcome });
  const rec = {
    session_id: LOG.session_id,
    started_at: LOG.started_at,
    outcome: outcome,
    variant: LOG.variant,
    context: Object.assign({
      congestion_class: pending ? pending.congestion_class : null,
      board_stop: pending ? (pending.board_stop || null) : null,
      dest_stop:  pending ? (pending.dest_stop  || null) : null,
      gps_points: (pending && pending.trajectory) ? pending.trajectory.length : 0,
      screen_w: window.innerWidth, screen_h: window.innerHeight,
      lang: lang, app_version: APP_VERSION,
      posture: LOG.posture,                           // セッション開始時点の値
      practice: LOG.practice,                         // true なら練習＝分析から外す
      response_cid: pending ? pending.cid : null
    }, extra || {}),
    summary: {
      t_total: t_total,            // クラスタップ→確定までの所要時間(ms)
      t_class: LOG.t_class,        // クラス選択画面表示→クラスタップ(参考・待機時間を含みうる)
      t_stop:  LOG.t_stop,         // バス停欄に費やした時間(ms)
      t_count: (LOG.count_view_at!=null) ? Math.round(performance.now()-LOG.count_view_at) : null,  // 人数画面表示→確定
      t_first: LOG.t_first,        // 人数画面表示→最初の値入力操作（思考時間の目安）
      taps_total: LOG.taps, taps_value: LOG.taps_value, corrections: LOG.corrections
    },
    events: LOG.events
  };
  saveSession(rec);
  LOG = null;
}

/* --- セッションのローカル退避と送信 --- */
function uiSessions(){ try{ return JSON.parse(localStorage.getItem(UISTUDY_KEY) || "[]"); }catch(e){ return []; } }
function saveUiSessions(a){ try{ localStorage.setItem(UISTUDY_KEY, JSON.stringify(a)); }catch(e){} }
function saveSession(rec){ const a = uiSessions(); a.push(rec); saveUiSessions(a); flushSessions(); }

async function flushSessions(){
  if(!user || !configured) return;
  const a = uiSessions(); if(!a.length) return;
  const keep = [];
  for(const rec of a){
    try{
      const { error } = await sb.from("ui_sessions")
        .insert(Object.assign({}, rec, { client_submitted_at: new Date().toISOString() }));
      if(error) throw error;
    }catch(err){
      console.error("[ui_sessions] insert失敗:", err?.code || "", err?.message || err);
      keep.push(rec);
    }
  }
  saveUiSessions(keep);
}

// 研究用: 未送信ぶんも含めローカルのセッションをJSONで書き出す
function exportUiLog(){
  const data = JSON.stringify(uiSessions(), null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ui_sessions_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}
window.exportUiLog = exportUiLog;

/* ---------------- helpers ---------------- */
function toast(msg,color){ const el=$("toast"); el.textContent=msg; el.style.background=color||"#16a34a"; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1500); }
function hhmm(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function nowSec(){ return Math.floor(Date.now()/1000); }
function uuid(){   // crypto.randomUUID 未対応環境(旧iOS Safari等)でも落ちないように
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); });
}
function handleName(){
  if(!user) return "—";
  const m=user.user_metadata||{};
  return m.display_name || m.name || (user.email||"").split("@")[0] || user.id.slice(0,8);
}
function setStatus(msg,warn){
  const s=$("status"); const n=outbox().length;
  let base = msg||"";
  if(n>0) base = (base?base+" · ":"") + T[lang].pendingN(n);
  // 版番号を常に表示する。実験中にどの版を使っていたかを端末側でも確認できるように
  base = (base?base+" · ":"") + APP_VERSION;
  s.textContent = base;
  s.className = "statusbar" + (warn?" warn":"");
}

/* ---------------- outbox (端末退避＆再送) ---------------- */
function outbox(){ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||"[]"); }catch(e){ return []; } }
function saveOutbox(a){ try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); }catch(e){} }
function outboxUpsert(item){ const a=outbox(); const i=a.findIndex(x=>x.cid===item.cid); if(i>=0)a[i]=item; else a.push(item); saveOutbox(a); }
function outboxRemove(cid){ saveOutbox(outbox().filter(x=>x.cid!==cid)); }

async function insertRecord(rec){
  // 実際に送信する瞬間の端末時刻を付与（サーバのcreated_atとの差＝端末時計のズレ検出用）
  const payload = Object.assign({}, rec, { client_submitted_at: new Date().toISOString() });
  const { error } = await sb.from("ui_responses").insert(payload);
  if(error) throw error;
}
async function flushOutbox(){
  if(!user) return;
  for(const item of outbox().filter(x=>x.ready)){
    try{ await insertRecord(item.rec); outboxRemove(item.cid);
      const e=logEntries.find(x=>x.cid===item.cid); if(e){ e.state="ok"; }
    }catch(err){ console.error("[flushOutbox] insert失敗:", err?.code||"", err?.message||err); }
  }
  // 人数入力中は画面を作り直さない（回答フローを中断させない）
  if(view==="report" && !answering && !pending) renderMain();
  setStatus();
}

/* ---------------- GPS 軌跡サンプリング ---------------- */
let watchId=null, lastSampleTs=0, geoOk=false;
function startSampling(){
  if(watchId!=null) return;
  if(!navigator.geolocation){ setStatus(T[lang].gpsNo,true); return; }
  setStatus(T[lang].gpsOn);
  watchId = navigator.geolocation.watchPosition(
    (p)=>{
      geoOk=true;
      const now=Date.now();
      if(now-lastSampleTs < SAMPLE_MS-300) return;   // 約2.5秒間隔に間引き
      lastSampleTs=now;
      const c=p.coords;
      const hdg=(c.heading!=null && !isNaN(c.heading)) ? Math.round(c.heading) : null;   // 進行方位(度)
      const spd=(c.speed!=null && !isNaN(c.speed)) ? +c.speed.toFixed(1) : null;          // 速度(m/s)
      const pt={ t:nowSec(), lat:+c.latitude.toFixed(6), lng:+c.longitude.toFixed(6), acc:Math.round(c.accuracy), hdg:hdg, spd:spd };
      // 常時: 直近30秒をpreBufferに保持（前倒し用）
      preBuffer.push({ ...pt, _ms:now });
      const cut=now-30000; while(preBuffer.length && preBuffer[0]._ms<cut) preBuffer.shift();
      // 回答中なら軌跡にも追加
      if(pending && pending.trajectory){
        pending.trajectory.push(pt);
        if(pending.cid) syncPendingToOutbox(false);
      }
      setStatus(T[lang].gpsOk);
    },
    (e)=>{   // 許可拒否と、車内でありがちなタイムアウト/一時的な取得不可を区別
      if(e && e.code===1) setStatus(T[lang].gpsNo,true);     // PERMISSION_DENIED
      else setStatus(T[lang].gpsSlow,false);                 // TIMEOUT / POSITION_UNAVAILABLE
    },
    { enableHighAccuracy:true, maximumAge:3000, timeout:15000 }
  );
}
function stopSampling(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

/* ---------------- 回答フロー ---------------- */
function pickClass(cls){
  // 直前の回答が確定待ちなら即確定（★未コミットならここで確実にコマを消費させる）
  if(pending){ commitVariant(pending.variant); finalizeNow(true); }
  const variant = peekVariant();       // ★UI研究: この回答に使う条件（確定はsubmit()でcommit）
  logStart(cls, variant);
  LOG.t_class = LOG.events[0] ? LOG.events[0].since_picker_ms : null;
  logTap("class_" + cls);
  const now=Date.now();
  // クラスタップ“前”の直近PRE_MS秒の測位を取り込む（前倒し）
  const seed = preBuffer.filter(p=>p._ms>=now-PRE_MS).map(({_ms,...pt})=>pt);
  pending = { cid: uuid(), congestion_class:cls, exact_count:null,
              answered_at:new Date().toISOString(), variant: variant,
              firstTs: seed.length ? (now-PRE_MS) : now, trajectory: seed };
  pending.session_id = LOG.session_id;   // ★UI研究: 操作ログとGPS軌跡を突合するためのキー
  startSampling();
  grabOneShot();     // #5(A): 即しまわれても代表点が1つ残るよう、その場で一発測位
  renderCount();
}

// 回答時に位置を一発取得（軌跡が空でも代表点を確保）。任意・失敗しても無視。
function grabOneShot(){
  if(!navigator.geolocation) return;
  const cid=pending && pending.cid;
  navigator.geolocation.getCurrentPosition((p)=>{
    if(!pending || pending.cid!==cid || !pending.trajectory) return;
    const c=p.coords;
    const pt={ t:nowSec(), lat:+c.latitude.toFixed(6), lng:+c.longitude.toFixed(6), acc:Math.round(c.accuracy),
               hdg:(c.heading!=null&&!isNaN(c.heading))?Math.round(c.heading):null,
               spd:(c.speed!=null&&!isNaN(c.speed))?+c.speed.toFixed(1):null };
    if(!pending.trajectory.some(q=>Math.abs(q.t-pt.t)<2)){   // 同時刻の重複を避けて先頭に
      pending.trajectory.unshift(pt);
      if(pending.cid) syncPendingToOutbox(false);
    }
    geoOk=true; setStatus(T[lang].gpsOk);
  }, ()=>{}, { enableHighAccuracy:true, maximumAge:10000, timeout:15000 });
}

/* ---------------- 停留所オートコンプリート ---------------- */
function jhav(la1,ln1,la2,ln2){ const R=6371000,r=Math.PI/180;
  const dla=(la2-la1)*r, dln=(ln2-ln1)*r;
  const a=Math.sin(dla/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dln/2)**2;
  return 2*R*Math.asin(Math.sqrt(a)); }
function userLoc(){ for(let i=preBuffer.length-1;i>=0;i--){ const p=preBuffer[i]; if(p.lat&&p.lng) return [p.lat,p.lng]; } return null; }
function stopCandidates(q){
  const S=window.HANKYU_STOPS||[]; const loc=userLoc(); const ql=(q||"").trim().toLowerCase();
  let arr;
  if(!ql){                               // 空欄: 近い順（GPSがあれば）、無ければ先頭数件
    arr = loc ? S.slice().sort((x,y)=>jhav(loc[0],loc[1],x.a,x.o)-jhav(loc[0],loc[1],y.a,y.o)) : S.slice();
  } else {                               // 入力あり: 前方一致→部分一致
    const pre=[], sub=[];
    for(const s of S){ const n=s.n.toLowerCase(); if(n.startsWith(ql)) pre.push(s); else if(n.includes(ql)) sub.push(s); }
    arr = pre.concat(sub);
  }
  const cap = ql ? 200 : 20;   // 入力あり=該当を全部(最大200)スクロール表示 / 空欄=近い順20件
  return arr.slice(0,cap).map(s=> loc ? Object.assign({_d:jhav(loc[0],loc[1],s.a,s.o)}, s) : Object.assign({}, s));
}
function wireStopField(inputId, listId, selId, field){
  const inp=$(inputId), list=$(listId), sel=$(selId);
  if(!inp) return;
  const fmtD=(d)=> d<1000 ? Math.round(d)+"m" : (d/1000).toFixed(1)+"km";
  const clear=()=>{ if(pending) pending[field]=null; inp.value=""; sel.innerHTML=""; list.classList.remove("show");
    if(LOG) LOG.corrections++; logEvent("stop_clear", { field:field }); };
  const choose=(s, rank)=>{ if(pending) pending[field]={name:s.n, lat:s.a, lng:s.o};
    logEvent("stop_select", { field:field, rank:(rank==null?null:rank+1), name:s.n });
    if(LOG && LOG.stop_focus_at!=null){ LOG.t_stop += Math.round(performance.now()-LOG.stop_focus_at); LOG.stop_focus_at=null; }
    inp.value=s.n; list.classList.remove("show");
    sel.innerHTML=`✓ ${T[lang].stop_selected}: ${s.n} <span class="clr">${T[lang].stop_clear}</span>`;
    const c=sel.querySelector(".clr"); if(c) c.onclick=clear; };
  const render=(q)=>{
    const cs=stopCandidates(q);
    if(!cs.length){ list.classList.remove("show"); list.innerHTML=""; return; }
    list.innerHTML=cs.map((s,i)=>`<div class="stoprow" data-i="${i}">${s.n}${s._d!=null?`<span class="dist">${fmtD(s._d)}</span>`:""}</div>`).join("");
    list.classList.add("show");
    logEvent("stop_candidates", { field:field, count:cs.length });
    // clickで確定（ドラッグ＝スクロール時はclickが発火しないので、スクロールと両立）
    list.querySelectorAll(".stoprow").forEach(row=>{
      row.addEventListener("click",()=>choose(cs[+row.dataset.i], +row.dataset.i)); });
  };
  inp.addEventListener("input", ()=>{ if(pending) pending[field]=null;
    // 文字はあるが未選択 → 「候補から選んで」を表示（この状態では保存されない）
    sel.innerHTML = inp.value.trim() ? `<span style="color:var(--muted)">${T[lang].stop_pick_hint}</span>` : "";
    if(LOG && LOG.stop_focus_at == null) LOG.stop_focus_at = performance.now();  // focus未取得でも計測開始
    logEvent("stop_input", { field:field, chars: inp.value.trim().length });
    render(inp.value); });
  inp.addEventListener("focus", ()=>{
    logEvent("stop_focus", { field:field });
    if(LOG) LOG.stop_focus_at = performance.now();
    if(!inp.value) render(""); });
  // blurでの自動閉じはしない（一覧のスクロールを妨げるため）。一覧外タップで閉じる（下の共通ハンドラ）。
  if(pending && pending[field]){                       // 既存選択を復元
    inp.value=pending[field].name;
    sel.innerHTML=`✓ ${T[lang].stop_selected}: ${pending[field].name} <span class="clr">${T[lang].stop_clear}</span>`;
    const c=sel.querySelector(".clr"); if(c) c.onclick=clear;
  }
  // 一覧外をタップしたら開いている候補一覧を閉じる（全フィールド共通・1回だけ登録）
  if(!window.__stopOutsideBound){
    document.addEventListener("pointerdown",(e)=>{
      const fld=(e.target.closest)?e.target.closest(".stopfield"):null;
      document.querySelectorAll(".stoplist.show").forEach(l=>{ if(!fld || !fld.contains(l)) l.classList.remove("show"); });
    });
    window.__stopOutsideBound=true;
  }
}

// クラスごとの人数レンジ。**入力の制限ではなく「目安」と初期値の基準**として使う。
const COUNT_RANGES=[[0,5],[6,15],[16,25],[26,40],[41,55],[56,99]];
// 実際に入力できる範囲：クラスに関係なく共通
const COUNT_MIN=0, COUNT_MAX=99;
function renderCount(){
  const t=T[lang];
  const [lo,hi]=COUNT_RANGES[pending.congestion_class-1];
  // ★UI研究: 人数入力の初期値を条件で切替（none=未入力 / min=下限 / median=中央値）
  const initMode  = (pending.variant && pending.variant.count_init) || "none";
  const inputMode = (pending.variant && pending.variant.input) || "stepper";
  const nInit = (initMode==="min") ? lo : (initMode==="median") ? Math.round((lo+hi)/2) : null;
  // 入力途中の値は pending に持たせる。言語切替やナビで描き直されても失わないため。
  // 条件(variant)はクラスタップ時に確定済みなので、描き直しても条件は進まない
  const firstDraw = (pending.n_live===undefined);
  if(firstDraw){ pending.n_live=nInit; pending.n_fresh=(nInit!==null); pending.n_unknown=false; }
  let n = pending.n_live;
  let fresh = pending.n_fresh;    // テンキー: プリセットが未置換か
  const cls=t.classes[pending.congestion_class-1];
  // 入力方式の条件で人数入力部を差し替える（他の要素は完全に同じにする）
  const ctrlHtml = (inputMode === "numpad") ? `
      <div class="numwrap">
        <div class="count noval" id="cval">—</div>
        <div class="numpad">
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
          <button class="npfn" data-k="C">C</button><button data-k="0">0</button><button class="npfn" data-k="B">⌫</button>
        </div>
      </div>` : `
      <div class="stepper">
        <button class="mi" data-d="-5">−5</button><button class="mi" data-d="-1">−1</button>
        <div class="count noval" id="cval">—</div>
        <button class="pl" data-d="1">＋1</button><button class="pl" data-d="5">＋5</button>
      </div>`;
  main.innerHTML = `
    <button class="backbtn" id="backPick">← ${t.back}</button>
    <div class="center">
      <div class="selchip"><span class="chip c${pending.congestion_class}">${pending.congestion_class}</span>${cls.lbl}<span class="rng">${t.count_range} ${cls.rng}</span></div>
      <h2>${t.countTitle}</h2>
      <p class="hint">${t.countHint}</p>
      ${ctrlHtml}
      <div class="unknownrow">
        <button type="button" id="unknownBtn">${t.unknown}</button>
      </div>
      <div class="stopwrap">
        <div class="stopfield">
          <label>${t.board_label}</label>
          <input class="afield stopinput" id="boardInput" type="text" autocomplete="off" placeholder="${t.board_ph}">
          <div class="stoplist" id="boardList"></div>
          <div class="stopsel" id="boardSel"></div>
        </div>
        <div class="stopfield">
          <label>${t.dest_label}</label>
          <input class="afield stopinput" id="destInput" type="text" autocomplete="off" placeholder="${t.dest_ph}">
          <div class="stoplist" id="destList"></div>
          <div class="stopsel" id="destSel"></div>
        </div>
        <div class="stopsrc">${t.stop_source}</div>
      </div>
      <div class="row actions">
        <button class="btn primary" id="sendBtn">${t.send}</button>
        <button class="btn ghost" id="skipBtn">${t.skip}</button>
      </div>
    </div>`;
  answering = true;             // 人数入力画面を表示中（背景の再描画から保護）
  wireStopField("boardInput","boardList","boardSel","board_stop");
  wireStopField("destInput","destList","destSel","dest_stop");
  const cval=$("cval");
  const show=()=>{
    pending.n_live=n; pending.n_fresh=fresh;    // 描き直しに備えて保持
    cval.textContent = (n===null)?"—":((n>=COUNT_MAX)?COUNT_MAX+"+":String(n));
    cval.classList.toggle("noval", n===null);   // 未入力は破線枠で「まだ答えていない」と分かるように
  };
  show();                         // 初期は「—」＝未入力
  // ★UI研究:「わからない」の明示。値を消すだけの C(クリア) とは別物として扱う。
  // 「一度も触っていない未入力」「触ったが消した」「数えられないと明言した」を
  // 解析で区別できるようにするため、専用のイベントとフラグで残す
  const unknownBtn = $("unknownBtn");
  const showUnknown = ()=>{ unknownBtn.classList.toggle("on", !!pending.n_unknown); };
  showUnknown();
  unknownBtn.onclick=()=>{
    const before = n;
    n = null; pending.n_unknown = true;
    show(); showUnknown();
    // taps_value（値を作るための操作数）には数えない。値を作る操作ではないため。
    // 総タップ数は logTap() 側で数える
    if(LOG){ markFirst(); }
    logTap("unknown"); logEvent("count_unknown", { value_before: before });
  };
  // 描き直しは所要時間の計測をやり直させない。回数だけ別種別で残す
  if(firstDraw){
    // 操作ボタンの実寸も残す。ステッパーとテンキーは形が違うぶん標的サイズを完全には
    // 揃えられない（375pxで面積比1.40倍、320pxで1.82倍）。H2の差が入力方式によるものか
    // Fittsの法則どおり標的の大きさによるものかを、解析側で切り分けられるようにするため
    const ctl = main.querySelector(inputMode==="numpad" ? ".numpad button" : ".stepper button");
    const cr  = ctl ? ctl.getBoundingClientRect() : null;
    logEvent("screen_view", { screen:"count", input:inputMode, count_init:initMode,
                              lo:lo, hi:hi, cmin:COUNT_MIN, cmax:COUNT_MAX,
                              ctl_w: cr?Math.round(cr.width):null, ctl_h: cr?Math.round(cr.height):null,
                              vw: window.innerWidth, vh: window.innerHeight });
    if(LOG) LOG.count_view_at = performance.now();
  } else {
    logEvent("screen_redraw", { screen:"count", value:n });
  }

  if(inputMode === "numpad"){
    // プリセット値が入ったままの状態。最初の数字キーで置き換え、以降は追記（fresh は上で復元済み）
    main.querySelectorAll(".numpad button").forEach(b=>{ b.onclick=()=>{
      const k = b.dataset.k;
      if(k === "C"){ n = null; fresh = false; if(LOG) LOG.corrections++; }
      else if(k === "B"){ n = (n === null || n < 10) ? null : Math.floor(n/10); fresh = false; }
      else {
        const cur = fresh ? "" : (n === null ? "" : String(n));
        fresh = false;
        if(cur.length >= 2){                       // 2桁上限。無反応だと不安なので枠を光らせる
          cval.classList.add("full");
          setTimeout(()=>cval.classList.remove("full"), 200);
          if(LOG){ LOG.taps_value++; markFirst(); }
          logTap("key_"+k); logEvent("numkey", { key:k, value:n, ignored:true });
          return;
        }
        n = Math.min(COUNT_MAX, parseInt(cur + k, 10));
      }
      pending.n_unknown=false;      // 値を触ったら「わからない」の表明は取り消す
      show(); showUnknown();
      if(LOG){ LOG.taps_value++; markFirst(); }
      logTap("key_"+k); logEvent("numkey", { key:k, value:n });
    }; });
  } else {
    main.querySelectorAll(".stepper button").forEach(b=>{ b.onclick=()=>{
      const d=parseInt(b.dataset.d,10);
      // 初回タップはクラスの目安下限(lo)から開始（タップ数削減）。値はクラスに縛らず 0〜99 で自由。
      n=Math.max(COUNT_MIN,Math.min(COUNT_MAX,(n===null?lo:n)+d));
      pending.n_unknown=false;      // 値を触ったら「わからない」の表明は取り消す
      show(); showUnknown();
      if(LOG){ LOG.taps_value++; markFirst(); }
      logTap("step_"+(d>0?"+":"")+d); logEvent("stepper", { delta:d, value:n });
    }; });
  }
  $("sendBtn").onclick=()=>{ answering=false; pending.exact_count=n;
    logTap("send"); finishSession("submit", { count_touched: n!==nInit, exact_count:n,
                                              count_unknown: !!pending.n_unknown }); submit(); };
  $("skipBtn").onclick=()=>{ answering=false; pending.exact_count=null;
    logTap("skip"); finishSession("skip", { count_touched:false, exact_count:null,
                                            count_unknown: !!pending.n_unknown }); submit(); };
  $("backPick").onclick=()=>{ logTap("back"); if(LOG) LOG.corrections++;
    finishSession("abandon", {}); cancelPick(); };
}

// 人数画面で「戻る」: 誤タップしたクラス選択を破棄してクラス一覧へ戻す
function cancelPick(){
  answering=false;
  pending=null;                 // 未送信の回答を破棄
  renderMain();                 // クラス選択画面へ
}

// 回答の代表GPS点（answered_atに最も近い軌跡点）。軌跡が空なら位置なし。
function repPoint(p){
  const tj=p.trajectory||[];
  if(!tj.length) return { lat:null, lng:null, acc:null, at:null };
  const ansSec=Math.floor(new Date(p.answered_at).getTime()/1000);
  let best=tj[0], bd=Math.abs((tj[0].t||0)-ansSec);
  for(const q of tj){ const d=Math.abs((q.t||0)-ansSec); if(d<bd){ bd=d; best=q; } }
  return { lat: best.lat??null, lng: best.lng??null, acc: best.acc??null,
           at: best.t ? new Date(best.t*1000).toISOString() : null };
}
function buildRec(p){
  const rp=repPoint(p);
  return { answered_at:p.answered_at, congestion_class:p.congestion_class,
           exact_count:p.exact_count, trajectory:p.trajectory,
           board_stop:p.board_stop||null, dest_stop:p.dest_stop||null,
           lat:rp.lat, lng:rp.lng, gps_accuracy:rp.acc, gps_fixed_at:rp.at,   // 代表位置(独立カラム)
           lang:lang, app_version:APP_VERSION,
           session_id:p.session_id||null, client_id:p.cid,     // ★UI研究: ui_sessions と結合
           practice:!!(p.variant && p.variant.practice) };     // 回答側にも持たせる（結合せず除外できるように）
}
function syncPendingToOutbox(ready){
  if(!pending) return;
  outboxUpsert({ cid:pending.cid, ready:!!ready, rec:buildRec(pending) });
}

function submit(){
  commitVariant(pending.variant);   // ★UI研究: 送信/スキップが確定したのでローテーションを1つ進める
  // 画面ログに「記録中」で追加
  const entry={ cid:pending.cid, congestion_class:pending.congestion_class,
                exact_count:pending.exact_count, answered_at:pending.answered_at, state:"rec" };
  logEntries.unshift(entry);
  syncPendingToOutbox(false);   // 未確定として退避(クラッシュ耐性)
  // 送信後もしばらく測位を続け、ウィンドウ到達で確定
  const now=Date.now();
  let target = pending.firstTs + WINDOW_MS;
  target = Math.max(target, now + POST_SUBMIT_MIN_MS);
  target = Math.min(target, pending.firstTs + WINDOW_MAX_MS);
  pending.finalizeAt = target;
  renderMain();
  startCountdown();
  finalizeTimer = setTimeout(()=>finalizeNow(false), Math.max(0, target-now));
}

function startCountdown(){
  clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    if(!pending){ clearInterval(countdownTimer); return; }
    const remain=Math.max(0,Math.ceil((pending.finalizeAt-Date.now())/1000));
    const e=logEntries.find(x=>x.cid===pending.cid);
    if(e){ e.remain=remain; e.npts=pending.trajectory.length;
      // 全画面ではなく該当行のステータスだけ更新（スクロール位置やタップを壊さない）
      const cell=document.querySelector(`.lstat[data-cid="${e.cid}"]`);
      if(cell){ const s=statusOf(e); cell.className="lstat "+s.stc; cell.innerHTML=s.st; }
    }
    if(remain<=0){ clearInterval(countdownTimer); }
  }, 1000);
}

async function finalizeNow(immediate){
  if(!pending) return;
  clearTimeout(finalizeTimer); finalizeTimer=null;
  clearInterval(countdownTimer);
  const p=pending; pending=null;
  const rec=buildRec(p);
  const entry=logEntries.find(x=>x.cid===p.cid);
  // 送信試行
  let ok=false;
  if(user){
    try{ await insertRecord(rec); ok=true; outboxRemove(p.cid); }
    catch(err){ ok=false; console.error("[finalizeNow] insert失敗:", err?.code||"", err?.message||err); }
  }
  if(!ok){ outboxUpsert({ cid:p.cid, ready:true, rec }); }
  if(entry){ entry.state = ok?"ok":"pend"; entry.npts=p.trajectory.length; delete entry.remain; }
  // 非同期の後処理: 次の回答を入力中(新pending)や人数画面表示中は画面を作り直さない
  // （前の回答の確定処理が、出したばかりの人数画面を上書きしてしまう不具合を防ぐ）
  if(view==="report" && !answering && !pending) renderMain();
  setStatus();
  toast(ok?T[lang].saved:T[lang].queued, ok?"#16a34a":"#f59e0b");
  // 測位は止めない（次回の前倒し用にpreBufferを温め続ける。画面を離れた時のみ停止）
}

/* ---------------- 画面描画 ---------------- */
function statusOf(e){   // ログ行の送信状況（記録中/送信済/未送信）
  const t=T[lang];
  if(e.state==="rec")  return {stc:"rec",  st:`${t.st_rec} ${e.remain!=null?e.remain+"s":""}<br>${(e.npts||0)}pt`};
  if(e.state==="ok")   return {stc:"ok",   st:`✓ ${t.st_ok}<br>${(e.npts||0)}pt`};
  if(e.state==="pend") return {stc:"pend", st:`⧗ ${t.st_pend}<br>${(e.npts||0)}pt`};
  return {stc:"", st:""};
}
function renderMain(){
  if(view!=="report") { updateNav(); return; }   // データ一覧表示中は報告画面で上書きしない
  const t=T[lang];
  updateNav();
  let cards="";
  t.classes.forEach((c,i)=>{ cards+=`<button class="card c${i+1}" onclick="pickClass(${i+1})"><span class="num">${i+1}</span><span class="cardtext"><span class="lbl">${c.lbl}</span><span class="rng">${c.rng}</span></span></button>`; });
  let rows="";
  if(logEntries.length===0){ rows=`<div class="empty">${t.none}</div>`; }
  else{
    logEntries.forEach(e=>{
      const cls=t.classes[e.congestion_class-1];
      const countTxt=(e.exact_count!=null)?`${e.exact_count}${t.ppl}`:`<span style="color:var(--muted)">${cls.lbl}</span>`;
      const {stc,st}=statusOf(e);
      rows+=`<div class="logrow">
        <span class="chip c${e.congestion_class}">${e.congestion_class}</span>
        <span class="lt">${hhmm(e.answered_at)}</span>
        <span class="lmid"><div class="lcount">${countTxt}</div><div class="lsub">${cls.lbl}</div></span>
        <span class="lstat ${stc}" data-cid="${e.cid}">${st}</span>
      </div>`;
    });
  }
  main.innerHTML = `
    <div class="picker"><div id="pracwrap">${pracBanner(t)}</div><div class="expbar" id="expbar">${expBarInner(t)}</div><p class="ptitle">${t.pick}</p><div class="grid">${cards}</div></div>
    <div class="log">
      <div class="lhead"><span>${t.records} ${logEntries.length}</span><span>${t.log_head}</span></div>
      ${rows}
    </div>`;
  wireExpBar();
  renderPracBanner();   // バナーのタップ（＝練習終了）を有効にする
  setStatus();
  pickerShownAt = performance.now();   // ★UI研究: クラス選択画面が出た時刻
  startSampling();   // 一覧表示中は測位を回してpreBufferを温める（前倒し）
}

/* ---------------- 画面ルーター & ナビ ---------------- */
function updateNav(){
  const t=T[lang];
  $("brandTag").textContent=t.brand_tag;
  $("navReport").textContent=t.nav_report; $("navFeed").textContent=t.nav_feed;
  $("navReport").classList.toggle("on", view==="report");
  $("navFeed").classList.toggle("on", view==="feed");
  $("langBtn").textContent=t.langLabel;
  $("sess").innerHTML = (user && view==="report") ? t.who(handleName()) : "";
  $("outBtn").style.display = user ? "" : "none";
  // データ一覧は管理者のみ。スタッフにはボタンを出さない
  const adminOK = isAdmin();
  $("navReport").classList.toggle("solo", !adminOK);   // 管理者以外は「報告」だけ
  $("navFeed").style.display = adminOK ? "" : "none";
  // パスワード再設定中はナビを隠して画面に集中させる
  const focus = (view==="report" && (authMode==="reset" || authMode==="newpass"));
  $("navReport").style.visibility = focus ? "hidden" : "";
  $("navFeed").style.visibility  = (focus||!adminOK) ? "hidden" : "";
}
function setView(v){ if(v==="feed" && !isAdmin()) v="report"; view=v; render(); }
function render(){
  updateNav();
  if(view==="feed"){ renderFeed(); return; }
  if(user && authMode!=="newpass"){
    // 人数入力中にナビや言語切替を押しても、入力中の回答を捨てずに描き直す。
    // renderMain() に戻すと入力値が消えるうえ pending が残り、次のクラス選択で
    // 画面ログに出ない行が送信されてしまう（計測セッションも宙に浮く）
    if(view==="report" && answering && pending) renderCount();
    else renderMain();
  }
  else { renderAuth(); }                               // 未ログイン or パスワード再設定中
}

/* ---------------- データ一覧（公開ビュー report_feed を表示） ---------------- */
function renderFeed(){
  const t=T[lang];
  if(!user || !isAdmin()){   // データ一覧は管理者のみ（未ログイン/スタッフは報告へ）
    main.innerHTML=`<div class="login"><h1>${t.feed_title}</h1><p>${!user?t.feed_login:t.feed_admin_only}</p>
      <button class="btn primary" id="toLogin">${t.feed_login_btn}</button></div>`;
    $("toLogin").onclick=()=>setView("report");
    setStatus(); return;
  }
  main.innerHTML=`
    <div class="feed">
      <div class="feedhead">
        <h2>${t.feed_title}</h2><p>${t.feed_sub}</p>
        <div class="feedctl">
          <select id="fFilter">
            <option value="0">${t.feed_all}</option>
            ${t.classes.map((c,i)=>`<option value="${i+1}">${i+1} · ${c.lbl}</option>`).join("")}
          </select>
          <button id="fRefresh">${t.feed_update}</button>
          <button id="fExport">${t.ui_export}</button>
        </div>
      </div>
      <div class="feedlist" id="feedlist"><div class="empty">${t.feed_loading}</div></div>
    </div>`;
  $("fRefresh").onclick=loadFeed;
  if($("fExport")) $("fExport").onclick=exportUiLog;
  $("fFilter").onchange=loadFeed;
  setStatus();
  loadFeed();
}
async function loadFeed(){
  const t=T[lang]; const el=$("feedlist"); if(!el) return;
  if(!configured){ el.innerHTML=`<div class="empty">${t.notconf}</div>`; return; }
  const cls=parseInt(($("fFilter")||{}).value||"0",10);
  el.innerHTML=`<div class="empty">${t.feed_loading}</div>`;
  let q=sb.from("ui_report_feed").select("*").order("created_at",{ascending:false}).limit(200);
  if(cls) q=q.eq("congestion_class",cls);
  const { data, error } = await q;
  if(!el.isConnected) return;
  if(error){ el.innerHTML=`<div class="empty">${t.feed_err}<br><span style="font-size:11px">${error.message||""}</span></div>`; return; }
  if(!data || !data.length){ el.innerHTML=`<div class="empty">${t.feed_empty}</div>`; return; }
  const rows=data.map(r=>{
    const c=t.classes[r.congestion_class-1]||{lbl:"?"};
    const d=new Date(r.answered_at||r.created_at);
    const tm=`${d.getMonth()+1}/${d.getDate()}<br>${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    const cnt=(r.exact_count!=null)?`${r.exact_count}${t.ppl}`:"";
    return `<div class="frow">
      <span class="ft">${tm}</span>
      <span class="chip c${r.congestion_class}">${r.congestion_class}</span>
      <span class="fmid"><span class="flabel">${c.lbl}</span><span class="fcount">${cnt}</span></span>
      <span class="ftag">${t.staff_tag}</span>
    </div>`;
  }).join("");
  el.innerHTML=`<div style="font-size:12px;color:var(--muted);padding:6px 2px 8px">${t.feed_count(data.length)}</div>${rows}`;
}

/* ---------------- 認証（メール＋パスワード） ---------------- */
let authMode = "login";   // login | signup | sent
let authForm = { email:"", pass:"", name:"", sentEmail:"" };

function renderAuth(){
  const t=T[lang];
  updateNav();
  if(authMode==="sent"){
    main.innerHTML=`
      <div class="login">
        <h1>${t.sent_title}</h1>
        <p>${t.sent_desc(authForm.sentEmail)}</p>
        <button class="btn ghost" id="resendBtn">${t.resend}</button>
        <button class="btn ghost" id="backBtn">${t.to_login}</button>
      </div>`;
    $("resendBtn").onclick=async()=>{
      try{ await sb.auth.resend({ type:'signup', email:authForm.sentEmail,
            options:{ emailRedirectTo: location.origin+location.pathname } });
        toast(t.resent); }catch(e){ toast(e.message||"error","#dc2626"); }
    };
    $("backBtn").onclick=()=>{ authMode="login"; renderAuth(); };
    setStatus(configured?"":T[lang].notconf, !configured);
    return;
  }
  if(authMode==="reset"){   // パスワード再設定メールを送る
    main.innerHTML=`
      <div class="login"><h1>${t.reset_title}</h1><p>${t.reset_desc}</p>
        <div class="authform">
          <input class="afield" id="fEmail" type="email" inputmode="email" autocapitalize="none" autocomplete="email" placeholder="${t.ph_email}" value="${authForm.email||''}">
          <button class="btn primary" id="resetBtn">${t.reset_send}</button>
          <p class="hint" id="authNote"></p>
        </div>
        <button class="atab" id="backToLogin" style="border:none">${t.to_login}</button>
      </div>`;
    $("resetBtn").onclick=async()=>{
      const email=($("fEmail").value||"").trim();
      if(!email){ authNote(t.err_email); return; }
      authForm.email=email;
      const b=$("resetBtn"); b.disabled=true; b.textContent=t.signing;
      try{
        const { error }=await sb.auth.resetPasswordForEmail(email,{ redirectTo: location.origin+location.pathname });
        if(error) throw error;
        main.innerHTML=`<div class="login"><h1>${t.reset_title}</h1><p>${t.reset_sent}</p>
          <button class="btn ghost" id="backToLogin2">${t.to_login}</button></div>`;
        $("backToLogin2").onclick=()=>{ authMode="login"; renderAuth(); };
      }catch(e){ authNote(e.message||"error"); b.disabled=false; b.textContent=t.reset_send; }
    };
    $("backToLogin").onclick=()=>{ authMode="login"; renderAuth(); };
    setStatus(configured?"":t.notconf, !configured);
    return;
  }
  if(authMode==="newpass"){   // メールのリンクから戻ってきた: 専用の再設定画面
    main.innerHTML=`
      <div class="login">
        <div class="reseticon">🔑</div>
        <h1>${t.newpass_title}</h1>
        <p>${t.newpass_desc}</p>
        <div class="authform">
          <input class="afield" id="fNewPass" type="password" autocomplete="new-password" placeholder="${t.newpass_ph}">
          <button class="btn primary" id="npBtn">${t.newpass_save}</button>
          <p class="hint" id="authNote"></p>
        </div>
      </div>`;
    const submit=async()=>{
      const pass=$("fNewPass").value||"";
      if(pass.length<8){ authNote(t.err_pass); return; }
      const b=$("npBtn"); b.disabled=true; b.textContent=t.signing;
      try{
        const { error }=await sb.auth.updateUser({ password:pass }); if(error) throw error;
        // 成功: 明確な完了画面を出す（トーストだけだと分かりづらいため）
        main.innerHTML=`<div class="login"><div class="reseticon">✅</div>
          <h1>${t.newpass_done}</h1><p>${t.newpass_done_desc}</p>
          <button class="btn primary" id="goApp">${t.go_app}</button></div>`;
        $("goApp").onclick=()=>{ authMode="login"; view="report"; render(); };
      }catch(e){ authNote(e.message||"error"); b.disabled=false; b.textContent=t.newpass_save; }
    };
    $("npBtn").onclick=submit;
    $("fNewPass").addEventListener("keydown",(e)=>{ if(e.key==="Enter") submit(); });
    setStatus();
    return;
  }
  const isSignup = authMode==="signup";
  main.innerHTML=`
    <div class="login">
      <h1>${t.auth_title}</h1>
      <p>${t.auth_intro}</p>
      <div class="authtabs">
        <button class="atab ${!isSignup?'on':''}" id="tabLogin">${t.tab_login}</button>
        <button class="atab ${isSignup?'on':''}" id="tabSignup">${t.tab_signup}</button>
      </div>
      <div class="authform">
        ${isSignup?`<input class="afield" id="fName" type="text" placeholder="${t.ph_name}" autocomplete="name" value="${authForm.name||''}">`:``}
        <input class="afield" id="fEmail" type="email" inputmode="email" autocapitalize="none" autocomplete="email" placeholder="${t.ph_email}" value="${authForm.email||''}">
        <input class="afield" id="fPass" type="password" autocomplete="${isSignup?'new-password':'current-password'}" placeholder="${t.ph_pass}" value="${authForm.pass||''}">
        <button class="btn primary" id="authBtn">${isSignup?t.do_signup:t.do_login}</button>
        <p class="hint" id="authNote"></p>
        ${!isSignup?`<button class="atab" id="forgotBtn" style="border:none;color:var(--muted);font-weight:600">${t.forgot}</button>`:``}
      </div>
    </div>`;
  $("tabLogin").onclick=()=>{ grabAuth(); authMode="login"; renderAuth(); };
  $("tabSignup").onclick=()=>{ grabAuth(); authMode="signup"; renderAuth(); };
  $("authBtn").onclick=submitAuth;
  if($("forgotBtn")) $("forgotBtn").onclick=()=>{ grabAuth(); authMode="reset"; renderAuth(); };
  setStatus(configured?"":T[lang].notconf, !configured);
}
function grabAuth(){
  if($("fEmail")) authForm.email=$("fEmail").value.trim();
  if($("fPass"))  authForm.pass=$("fPass").value;
  if($("fName"))  authForm.name=$("fName").value.trim();
}
function authNote(msg){ const n=$("authNote"); if(n) n.textContent=msg||""; }
async function submitAuth(){
  const t=T[lang];
  if(!configured){ toast(t.notconf,"#dc2626"); return; }
  grabAuth();
  const email=normLogin(authForm.email), pass=authForm.pass;   // ID入力なら固定ドメイン付与
  if(!email){ authNote(t.err_email); return; }
  if(!pass || pass.length<8){ authNote(t.err_pass); return; }
  const btn=$("authBtn"); if(btn){ btn.disabled=true; btn.textContent=t.signing; }
  try{
    if(authMode==="signup"){
      if(!authForm.name){ authNote(t.err_name); return; }
      const { data, error } = await sb.auth.signUp({ email, password:pass,
        options:{ emailRedirectTo: location.origin+location.pathname, data:{ display_name:authForm.name } } });
      if(error) throw error;
      // 既登録メールの検知: Supabaseはユーザー列挙対策で、登録済みメールでも
      // エラーを返さず identities:[] の“ダミー”userを返す。これを弾いてログインへ誘導。
      if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
        authForm.email=email; authMode="login"; renderAuth(); authNote(t.already_registered); return;
      }
      if(data.session){ /* 確認OFF環境: 即ログイン(onAuthStateChangeが処理) */ }
      else { authForm.sentEmail=email; authMode="sent"; renderAuth(); return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password:pass });
      if(error){
        const m=(error.message||"").toLowerCase();
        if(m.includes("not confirmed")||m.includes("confirm")) authNote(t.err_unconfirmed);
        else authNote(t.err_login);
        throw error;
      }
    }
  }catch(e){
    if(!$("authNote")||!$("authNote").textContent) authNote(e.message||"error");
  }finally{
    const b=$("authBtn"); if(b){ b.disabled=false; b.textContent=(authMode==="signup")?t.do_signup:t.do_login; }
  }
}

async function boot(){
  $("langBtn").onclick=()=>{ lang=(lang==="ja")?"en":"ja"; render(); };
  $("outBtn").onclick=async()=>{
    if(sb){ await sb.auth.signOut(); }
    // ★UI研究: 着席/立席・練習モードはその時々の状態なので、ログアウトのたびにリセットする
    setDaily(POSTURE_KEY, null); setDaily(PRACTICE_KEY, null);
    user=null; authMode="login"; view="report"; render();
  };
  $("navReport").onclick=()=>setView("report");
  $("navFeed").onclick=()=>setView("feed");

  if(!configured){ render(); return; }

  // 再設定リンクから戻ってきた場合を早期検知（URLに type=recovery が付く）
  if(location.hash.includes("type=recovery") || new URLSearchParams(location.search).get("type")==="recovery"){
    authMode="newpass"; view="report";
  }
  // リスナーは getSession より前に登録（初期URL処理で発火する PASSWORD_RECOVERY を取りこぼさない）
  sb.auth.onAuthStateChange((ev, sess)=>{
    const prevUid = user ? user.id : null;
    user = sess ? sess.user : null;
    const uid = user ? user.id : null;
    if(ev==="PASSWORD_RECOVERY"){ authMode="newpass"; view="report"; render(); return; }  // 再設定リンクから復帰
    // ログイン/ログアウトが実際に変わった時だけ画面を作り直す。
    // スマホのフォーカス復帰やトークン更新でも発火するため、同一ユーザー継続中は
    // 画面を保持する（回答中にクラス選択へ戻される不具合を防ぐ）。
    if(uid!==prevUid){ render(); }
    else { updateNav(); }
    if(user){ flushOutbox(); flushSessions(); }
  });

  const { data:{ session } } = await sb.auth.getSession();
  user = session ? session.user : null;
  render();
  if(user && authMode!=="newpass") flushOutbox();

  // アプリを離れた瞬間に回答中レコードを確定（手動ボタンの代替）／復帰時に未送信を再送
  document.addEventListener("visibilitychange", ()=>{
    // 背景化: 送信後の記録中(pending & 人数入力は終了)だけ確定。人数入力中は保持したまま測位停止。
    if(document.hidden){ if(pending && !answering) finalizeNow(true); stopSampling(); }
    else if(user){ startSampling(); flushOutbox(); flushSessions(); }                        // 復帰: 測位再開＆再送
  });
  window.addEventListener("pagehide", ()=>{ if(pending) finalizeNow(true); });
}
boot();
</script>
